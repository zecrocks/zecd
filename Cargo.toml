[package]
name = "zecd"
version = "0.7.0-rc5"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = true
description = "A Bitcoin-Core-style JSON-RPC server for shielded and transparent Zcash (Ironwood, Orchard, Sapling, plus opt-in t-addresses), built on librustzcash"
repository = "https://github.com/zecrocks/zecd"
homepage = "https://zecd.org"

[[bin]]
name = "zecd"
path = "src/main.rs"
# The binary is the full product: HTTP servers + CLI. Library consumers can instead build with
# `default-features = false` (the embeddable node + the CLI cores, no axum/clap).
required-features = ["server", "cli"]

[dependencies]
# Async runtime + HTTP server (hyper's client side drives the zebra JSON-RPC backend).
# axum serves only the HTTP layers (`server::run`, `health::run`), so it is optional behind the
# `server` feature; it is also a dev-dependency (below) because `chain/zebra.rs`'s offline tests
# run a fake zebrad on it under every feature combination.
tokio = { version = "1.21", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "time", "io-util"] }
axum = { version = "0.7", features = ["json"], optional = true }
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

# Serialization. `arbitrary_precision` is REQUIRED: bitcoind emits amounts as JSON numbers
# with 8 decimals and clients parse them as Decimal; without this they round-trip through f64.
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

# CLI / config / logging. clap and tracing-subscriber serve only the CLI surface (the flag
# parsing and the binary's tracing init), so both ride the `cli` feature; the `tracing` facade
# stays unconditional.
clap = { version = "4.5", features = ["derive", "string", "env"], optional = true }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"], optional = true }

# Auth. hmac+sha2 implement Bitcoin Core's salted `rpcauth` scheme (HMAC-SHA256).
base64 = "0.22"
subtle = "2"
hmac = "0.12"
sha2 = "0.10"
# hash160 (= ripemd160(sha256)) for transparent-script address extraction in
# `getrawtransaction`; already in the tree via the zcash crates.
ripemd = "0.1"
# `signmessage`/`verifymessage` sign the double-SHA256 message hash with the transparent
# address's secp256k1 key and recover the signer's pubkey. The `recovery` feature provides the
# recoverable-ECDSA API (compact 65-byte header+sig, as zcashd/zallet produce). Already in the
# tree via the zcash crates; matches zallet's pin.
secp256k1 = { version = "0.29", features = ["recovery"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
hex = "0.4"

# Seed handling
age = { version = "0.11", features = ["armor"] }
bip0039 = { version = "0.12", features = ["std", "all-languages"] }
secrecy = "0.8"

# `prost` deserializes the compact-block / treestate / mempool protobuf types that
# `zcash_client_backend::proto` exposes and the zebra backend constructs (and that
# `sync/engine.rs` serializes to the on-disk block cache). `hyper-util`'s legacy client is the
# HTTP/1.1 client behind the zebra JSON-RPC backend.
prost = "0.14"
# lightwalletd transport. `tls-ring` makes tonic select the `ring` rustls crypto provider for
# its own ClientConfig (tonic 0.14 does this internally - no CryptoProvider::install_default
# needed); keep it the *only* rustls provider feature, or tonic's auto-selection breaks.
# `tls-native-roots` lets us trust the OS store (and SSL_CERT_FILE), which `tls-webpki-roots`
# alone does not.
tonic = { version = "0.14", features = ["gzip", "tls-ring", "tls-native-roots", "tls-webpki-roots"] }
# The rustls that tonic already dials with (via tokio-rustls), pulled in directly only for the
# `ServerCertVerifier` impl behind `[backend] tls_insecure_skip_verify`. `default-features =
# false` is load-bearing: rustls' defaults enable `aws_lc_rs` (and `prefer-post-quantum`, which
# implies it), which would land a second crypto provider in the tree and break tonic's
# auto-selection. `ring` matches tonic's `tls-ring`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
rusqlite = { version = "0.37", features = ["time"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }

# Zcash - versions identical to zcash-devtool/Cargo.toml
# `circuit` exposes `orchard::circuit::{ProvingKey, VerifyingKey}` so we can build the Orchard
# proving key once at startup and reuse it for every send (the PCZT prove path), instead of
# librustzcash's fused builder which rebuilds it per transaction.
orchard = { version = "0.15", default-features = false, features = ["circuit"] }
zcash_address = "0.13"
# `CompactSize` builds the length-prefixed preimage for the `signmessage`/`verifymessage`
# message hash (magic + message, each CompactSize-prefixed, double-SHA256), byte-identical to
# zcashd's `rpc/misc.cpp` and zallet.
zcash_encoding = "0.4"
# `transparent-inputs` lets transparent receivers surface in getrawtransaction/getaddressinfo
# and the received-by-address read paths; zecd's own wallets never expose transparent receivers.
# `pczt` exposes `create_pczt_from_proposal` / `extract_and_store_transaction_from_pczt`, the
# build/prove/store seam that lets the proving step take a cached Orchard proving key.
zcash_client_backend = { version = "0.24.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "transparent-inputs", "pczt"] }
zcash_client_sqlite = { version = "0.22.0", features = ["unstable", "orchard", "serde", "transparent-inputs"] }
zcash_keys = { version = "0.16", features = ["unstable", "orchard"] }
zcash_primitives = "0.30"
zcash_proofs = { version = "0.30", features = ["bundled-prover"] }
zcash_protocol = { version = "0.10", features = ["local-consensus"] }
zcash_transparent = "0.10"
# Script asm rendering + standard-script solver for `getrawtransaction` (already in the
# tree via zcash_transparent; same crate Zallet uses for this).
zcash_script = "0.4.5"
sapling = { package = "sapling-crypto", version = "0.7" }
# `NonEmpty` is the shape librustzcash's proposal API speaks (`ShieldedInputs::from_parts`,
# `Proposal` steps); needed by the hand-built z_mergetoaddress proposals. Same version the
# librustzcash workspace pins, so the types unify.
nonempty = "0.11"
# PCZT roles (Prover/Signer) for the cached-proving-key send path. Versions track the
# zcash_client_backend `pczt` feature's own pin (0.9.3).
pczt = { version = "0.9.3", default-features = false, features = ["prover", "signer", "orchard", "sapling"] }
zip32 = "0.2"
zip321 = "0.9"
libc = "0.2.186"
# Single-instance guard: an advisory exclusive lock on `<datadir>/.lock` so two zecd processes
# can't operate on the same data directory at once (mirrors zallet / zcashd). Linux only needs
# libc (already in-tree); windows-sys is pulled in transitively on Windows.
fmutex = "0.3"

# Optional drop-in allocator, enabled by both musl release images (`Dockerfile` and
# `Dockerfile.arm64`). musl's default `malloc-ng` contends under Orchard proving's multi-threaded
# (rayon) allocation churn - ~80x more futex syscalls than mimalloc - costing ~10% per shielded
# send on bare metal and several× in syscall-expensive sandboxes (gVisor/nested-virt/some CI);
# mimalloc restores parity in both. Native glibc builds (dev, tests) leave it off - glibc's own
# allocator already scales, so the dependency is pure overhead there.
mimalloc = { version = "0.1", optional = true }

[features]
# The binary's full surface, on by default so `cargo build`/`cargo test` and the release
# images are unchanged. A library consumer builds with `default-features = false` for the
# embeddable node (`crate::node`) plus the CLI cores, without axum or clap in the tree.
default = ["server", "cli"]
# The HTTP transports: the axum JSON-RPC server (`server::run`) and the health server.
server = ["dep:axum"]
# The clap CLI surface (`config::Cli`, the subcommand shells) and `daemon::init_tracing`.
cli = ["dep:clap", "dep:tracing-subscriber"]
# NB tonic/lightwalletd is deliberately NOT feature-gated (a zebra-only consumer still compiles
# the gRPC stack): the TLS value types on `BackendConfig` and the `Lwd` variants in
# `chain::AnySource` and its stream enums couple it into config/chain, so carving it out is its
# own project.
#
# The general rule that NB is the cautionary precedent for: a dependency stays gateable only
# while its types stay out of the shared layer. Keeping the wallet-side crates out of the
# config structs, the RPC handler signatures, and the registry enum is what makes the existing
# `server`/`cli` gates cheap, and it is why `librustzcash` types are confined to `wallet/`,
# `sync/` and `chain/` rather than threaded through `config.rs` and `rpc/`.
# Use mimalloc as the global allocator. Off by default; the musl release images opt in.
mimalloc = ["dep:mimalloc"]
# Hardened mimalloc (MI_SECURE): guard pages, encrypted/canary free-lists, randomized
# allocation. The shipped musl images build with this - it costs <4% on the proving path
# (compute-bound, so allocator hardening barely registers) while restoring the heap-exploitation
# mitigations that swapping out musl's `malloc-ng` would otherwise drop. `mimalloc` (non-secure)
# remains available for anyone who wants the last few percent. See FINDINGS.md.
mimalloc-secure = ["mimalloc", "mimalloc/secure"]
# NB: Ironwood (NU6.3 / V6) is **no longer a cargo feature** - it is compiled unconditionally (the
# published ironwood librustzcash line exposes the ironwood APIs unconditionally).
# Activation is purely consensus-height driven via `is_nu_active(NetworkUpgrade::Nu6_3, ...)`: LIVE
# on mainnet at height 3_428_143 and on testnet at 4_134_000 (both carried by `zcash_protocol`), and
# opt-in on regtest via the `ZECD_REGTEST_NU63_HEIGHT` env var (the ironwood harness sets it to 8;
# the standard harness leaves it unset, so that chain stays pre-NU6.3). So ironwood is "always
# built, live on both public networks" with no build flag - a mainnet send past 3_428_143 is an
# ironwood send. Every
# librustzcash crate is now a crates.io **stable release** (see the version reqs above) - there are
# no release-candidate pins left.

[dev-dependencies]
tempfile = "3"
# Frontier bookkeeping for the fabricated-chain reorg test (matches librustzcash's version).
incrementalmerkletree = "0.8"
# The fake in-process zebrad in `chain/zebra.rs`'s tests is an axum server, and the HTTP
# integration tests drive `server::router` with `tower::ServiceExt::oneshot`. Dev-dependencies
# so both compile under every feature combination (axum is otherwise `server`-only, and tower
# is test-only).
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

# Dependency notes.
#
# The ironwood / NU6.3 librustzcash line is consumed **straight from crates.io, entirely as stable
# releases**: the leaf crates (`zcash_primitives`/`zcash_proofs 0.30`, `orchard 0.15`,
# `zcash_protocol 0.10`, `zcash_keys 0.16`, `zcash_address 0.13.0`, `zcash_transparent 0.10.0`) and
# the wallet crates (`zcash_client_backend 0.24.0`, `zcash_client_sqlite 0.22.0`, `pczt 0.9.3`,
# `zip321 0.9.0`). The wallet crates rode release candidates until upstream published the finals on
# 2026-08-18; nothing here is a prerelease any more. That whole arrangement replaced the
# previous all-or-nothing `[patch.crates-io]` git pin of the whole librustzcash workspace to the
# `dw/ironwood-scan-model` rev `1105d8203` (zcash/librustzcash#2539), which existed only because the
# wallet crates had no ironwood release yet. The shardtree/incrementalmerkletree git pins went with
# it: this line depends on published `shardtree 0.7` / `incrementalmerkletree 0.8.2`, which carry the
# explicit-checkpoint-retention APIs and the `clear_flags` checkpoint-pruning panic fix the old pins
# existed for. Zecd carries **no librustzcash fork, no git pins, and no prerelease requirements**.
#
# Still-relevant notes inherited from the git-pin era (they describe the published line too):
#
# - **Self-send memo backfill is NOT in this line.** A cherry-pick (submitted upstream separately)
#   filled a received note's NULL memo for the wallet's *own* mined self-sends via a `put_blocks`
#   re-decryption pass. The gap is narrow and self-healing (the live mempool path fills the memo on
#   the authoring node; a from-seed restore recovers it via enhancement) - it only bites the
#   authoring node when the mempool missed its own self-send, and a rescan fixes it. Re-check when
#   bumping to the next release.
# - **Ironwood sends route through the cached-key PCZT path.** The published line BUILDS Ironwood
#   PCZTs (librustzcash#2543 landed - the old git rev rejected them), so the `ironwood_forces_fused`
#   gate in `actor.rs` is gone and post-NU6.3 sends no longer pay the fused path's ~4.5 s/send
#   keygen. `ProvingKeyCache` caches both circuit keys (`FixedPostNu6_2` for the V2 Orchard bundle,
#   `PostNu6_3` for the V3 Ironwood bundle); see the send-proving-path notes in the project docs.
# - **The extractor records Ironwood outputs** (since `zcash_client_backend 0.24.0-rc.7`). Through
#   rc.6, `extract_and_store_transaction_from_pczt` built its `SentTransaction` outputs from the
#   Sapling and Orchard bundles only, so a post-NU6.3 send's Ironwood payment/change outputs reached
#   the DB with no `sent_notes` row and no memo; it now records them (and tags every shielded sent
#   output with its note commitment tree). `actor::backfill_ironwood_memos` - the workaround that
#   re-decrypted the just-stored transaction - is gone. If a future bump ever regresses the
#   extractor, the symptom is a missing memo on an ironwood send's own outputs on the authoring
#   node, and only the regtest ironwood tier can see it.
# - **Pool migration is most of what the 0.22.0 sqlite line added, and zecd does not use it.** The
#   migration history/cancel/finalize APIs, a `MigrationUuid` identity, two migration views, and
#   schema migrations reworking those tables (txid to BLOB, uuid + committed_height columns) - all
#   over tables zecd never writes, so they run empty. Two changes do touch paths zecd is on.
#   `WalletWrite::store_transactions_to_be_sent` - the fully-transparent t-to-t send path's store
#   call - upserts each transaction's sent-output records rather than failing on a transaction the
#   wallet already recorded, and classifies each stored transaction against ZIP 318 at store time
#   instead of waiting for it to mine; both are strictly more forgiving.
# - **What the finals added over the last RCs**, none of it requiring a zecd source change.
#   `Proposal::check_transaction_size` estimates a step's serialized size from its inputs, outputs
#   and change and rejects a proposal that could not fit in a block (`MAX_BLOCK_BYTES`), as a new
#   `ProposalError` variant; every `propose_*` call and every build entry point
#   (`create_proposed_transactions`, `create_pczt_from_proposal`) runs it, so an over-large
#   selection now fails at proposal time with a specific error instead of at build time - which
#   matters most to the callers that deliberately select as many inputs as they can,
#   `z_shieldcoinbase` and an `ANY_TADDR` shield. The size constants behind the estimate are what
#   `zcash_primitives 0.30.1` publishes.
#   A new `standalone_address` schema migration relaxes the `addresses` constraint to admit
#   upstream's new bare-address import (`transparent-key-import`, which zecd does not enable);
#   it rebuilds the `addresses` table, so an existing wallet database is migrated in place.
#   Transparent P2SH inputs whose size the wallet has not been told now estimate as
#   `InputSize::Unknown` (the consensus maximum) rather than being guessed at P2PKH size; zecd
#   spends only P2PKH, so this is inert here.
# - **`orchard` 0.15.4 speeds up batched trial decryption**, which is how the compact-block scan
#   decrypts every block's outputs: GLV endomorphism setup is now shared across a whole batch
#   instead of recomputed per output. Shared secrets are byte-identical to the per-item path, so it
#   changes throughput only, never what the scan finds. 0.15.5 is a version-requirement bump only
#   (minimum `halo2_proofs` 0.3.5).
# - **Single-pool-group input selection** (upstream `00c789f9`): shielded inputs come from one of
#   two mutually-exclusive groups - {Orchard} or {Sapling+Ironwood}, never mixed - the NU6.3
#   migration model (past NU6.3 a new Orchard-address output becomes an ironwood V3 note, so Orchard
#   V2 is a legacy drain-only pool). Applied *unconditionally* (pre-NU6.3 too), so the default
#   (NU6.2) build no longer combines Sapling+Orchard inputs in one transaction; the `regtest_sapling`
#   e2e was updated to the turnstile model to match.
# - **Ironwood model** (matches devtool): ironwood notes are **Orchard V3 notes** - same key tree,
#   same key derivation, scanned by the existing Orchard path, stored in `ironwood_received_notes`
#   and surfaced in `v_received_outputs` with pool code 4; balances roll up via
#   `AccountBalance::ironwood_balance()`. **Sends**: the proposal auto-routes Orchard payment/change
#   into the ironwood bundle past NU6.3, and the prover adds an ironwood proof step
#   (`requires_ironwood_proof`/`create_ironwood_proof`) using a `PostNu6_3` proving key (see
#   `actor.rs`; mirrors devtool's `pczt/prove.rs`).
#
# The only remaining patch: i18n-embed-fl, a vendored 0.9.4 with the deterministic-argument-order
# fix from kellpossible/cargo-i18n#151 backported, so `age`'s fl! macro expansions (and therefore the
# reproducible Docker builds) stop being a per-build coin flip. Remove when an `age` release depends
# on i18n-embed-fl 0.10+.
[patch.crates-io]
i18n-embed-fl = { path = "vendor/i18n-embed-fl" }
