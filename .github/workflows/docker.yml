name: Docker

# Builds both Docker images and smoke-tests both binaries, mirroring zallet's
# test-docker-container workflow:
#   - Dockerfile - the reproducible StageX build (amd64 only; StageX publishes
#                         no arm64 images yet)
#   - Dockerfile.arm64 - the reproducible static-musl Alpine build for ARM hosts (pinned
#                         base + apk toolchain; not StageX-grade trust), run natively on a
#                         GitHub arm64 runner
# The full static release builds are slow, so this only runs when the image inputs
# change (the crate itself is built and tested by CI on every PR).

on:
  pull_request:
    paths:
      - Dockerfile
      - Dockerfile.arm64
      - .dockerignore
      # the license texts the runtime stage COPYs into /usr/share/doc/zecd
      - THIRD-PARTY-LICENSES.txt
      - LICENSE-*
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
      # the config the smoke test feeds to `zecd config check` in the container
      - deploy/zecd.toml
  push:
    branches: [main, master]
    paths:
      - Dockerfile
      - Dockerfile.arm64
      - .dockerignore
      # the license texts the runtime stage COPYs into /usr/share/doc/zecd
      - THIRD-PARTY-LICENSES.txt
      - LICENSE-*
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/docker.yml
      # the config the smoke test feeds to `zecd config check` in the container
      - deploy/zecd.toml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# contents:read is required for checkout - this repo is private, so zallet's
# `permissions: {}` pattern strips even repo read access from GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build_and_run:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stagex-amd64
            runner: ubuntu-latest
            dockerfile: Dockerfile
          - name: alpine-musl-arm64
            runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -f ${{ matrix.dockerfile }} -t zecd .

      - name: Run zecd inside the container
        run: docker run --rm zecd --version

      # `--version` proves the static binary loads; it touches nothing else. The first thing
      # zecd does on a real host is read a config file, so check one - `config check` parses a
      # production-shaped config, resolves every default and probes the datadir, and is
      # read-only (no datadir lock, no wallet DB, no cookie file), so it is safe to run in a
      # throwaway container and is the cheapest proof that the runtime image is more than a
      # version stamp. deploy/zecd.toml is the file the compose stack mounts at this path.
      - name: Check a production config inside the container
        run: |
          docker run --rm -v "$PWD/deploy/zecd.toml:/etc/zecd/zecd.toml:ro" zecd \
            config check --conf /etc/zecd/zecd.toml

      - name: Extract static binaries via the export stage
        run: |
          docker build -f ${{ matrix.dockerfile }} --target export -o ./out .
          test -x out/zecd
          file out/zecd

      # Logged so any two runs of the same commit can be diffed by hand - they should
      # be bit-for-bit identical (the i18n-embed-fl nondeterminism is patched in
      # vendor/; see the project docs "Gotchas").
      - name: Print binary hashes
        run: sha256sum out/zecd
