name: CI

# Offline tier: builds zecd and runs the full `cargo test` suite (unit + HTTP integration +
# the regtest network/lifecycle tests) plus clippy. No network or Docker required, so this is
# the gating check that runs on every push/PR - including from automated runs.

on:
  push:
    # Mainline only: feature branches (incl. feature/**) are covered by the pull_request trigger
    # below, so listing them here too would run every job twice on a PR push.
    branches: [main, master]
    # Skip the Rust build/test/clippy/deny/msrv tier for changes that can't affect it:
    # docs, the release/docker/regtest workflows, the Dockerfiles, and the release packaging
    # script. (Editing ci.yml itself still runs - it's not ignored.)
    #
    # `zecd.example.toml` and `deploy/**` are deliberately NOT ignored: tests/cli.rs runs
    # `zecd config check` over the sample configs this repo ships, so editing one of them can
    # fail this tier and must therefore run it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - "Dockerfile*"
      - ".dockerignore"
      - "scripts/build-deb.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/regtest.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
      - "Dockerfile*"
      - ".dockerignore"
      - "scripts/build-deb.sh"
      - ".github/workflows/release.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/regtest.yml"
  # The Windows *target* check (`windows-cross`) runs automatically on every PR. This dispatch
  # input adds the heavier MSVC-toolchain job on a Windows runner - see `windows-msvc` below.
  workflow_dispatch:
    inputs:
      windows_msvc:
        description: "Also run the MSVC-toolchain check on a Windows runner (see `windows-msvc`)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting (both workspaces)
        run: |
          cargo fmt --all --check
          cargo fmt --all --check --manifest-path regtest-harness/Cargo.toml

      - name: Build (both binaries)
        run: cargo build --bins

      - name: Test (offline - includes the regtest network + wallet-lifecycle tests)
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # Library feature combinations: the crate is consumable with `default-features = false`
  # (the embeddable node + CLI cores, no axum/clap), so every combination the gates create
  # must stay warning-free and the library-only tests green. The default-features path is
  # already covered by the `test` job above.
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Every combination the gates in Cargo.toml create is built here, so a `use` or helper
      # that only one combination needs fails the job rather than review.
      - name: Clippy across feature combinations
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features --features server -- -D warnings
          cargo clippy --all-targets --no-default-features --features cli -- -D warnings

      - name: Test library-only (no default features)
        run: cargo test --no-default-features

  # Dependency policy: RustSec advisories (vulnerabilities AND unmaintained crates),
  # license allowlist, wildcard-version ban, and registry/git source pinning. Exceptions
  # (with rationale) live in deny.toml; .cargo/audit.toml mirrors the advisory exceptions
  # for local `cargo audit` runs.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check advisories, licenses, bans, sources
        run: cargo deny check

  # Verify the crate still builds at the declared minimum supported Rust version
  # (Cargo.toml `rust-version`). The floor is set by the librustzcash wallet stack:
  # tonic 0.14.6 and home 0.5.12 both require 1.88.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Check at MSRV
        run: cargo check --all-targets

  # (The former dedicated `ironwood` clippy job is gone: ironwood is now compiled unconditionally,
  # so the `test` job's `cargo clippy --all-targets -- -D warnings` above already covers it.)

  # Windows *target* check, cross-compiled from Ubuntu - runs on every PR.
  #
  # Windows is not a supported deployment target: zecd ships as a static-musl Linux binary, its
  # hardening and file-permission paths are Unix-specific, and the regtest tier drives Unix node
  # binaries. What this protects is the *library* consumer, since zecd is embeddable
  # (`default-features = false`): a host application that happens to build for Windows should
  # fail on a feature it cannot use, not on a stray ungated `libc` call in code it never runs.
  # That is the exact regression it was added for - `lock::hostname` called `libc::gethostname`,
  # which libc declares only on Unix, so the whole crate failed to compile for Windows while
  # every other platform-specific site in the tree was correctly `cfg(unix)`-gated.
  #
  # It cross-compiles to `x86_64-pc-windows-gnu` on an Ubuntu runner rather than running on
  # `windows-latest`, which is what makes it cheap enough to run automatically: no Windows
  # runner minutes, and `cargo check` needs no linking. mingw-w64 is required because the C
  # build scripts in the tree (ring, secp256k1-sys, libsqlite3-sys) must compile for the target.
  #
  # This is deliberately automatic rather than opt-in. An occasional manual check means the next
  # ungated `libc` call reaches a release unnoticed, and the first thing to break is a library
  # consumer's build - the failure mode this job exists to prevent. The `windows-msvc` job below
  # remains manual for the rarer case where the MSVC toolchain itself is in question.
  windows-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler and the mingw-w64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler mingw-w64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # `check`, not `test`: the point is that the crate compiles for the target. Both feature
      # combinations matter - the embeddable library (what a Windows consumer would actually
      # depend on) and the full binary surface, since the gating bug lived in code reachable
      # from both.
      - name: Check the embeddable library for Windows
        run: cargo check --lib --no-default-features --target x86_64-pc-windows-gnu

      - name: Check with default features for Windows
        run: cargo check --all-targets --target x86_64-pc-windows-gnu

  # The same check against the real MSVC toolchain on a Windows runner. Manual
  # (Run workflow -> `windows_msvc` ticked), because `windows-cross` above already catches the
  # regression class this exists for, on a Linux runner, for a fraction of the cost. Reach for
  # this when the MSVC toolchain specifically is in question - a `cc`/`build.rs` change, or a
  # dependency whose Windows support differs between the gnu and msvc targets.
  windows-msvc:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: choco install protoc --no-progress -y

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the embeddable library
        run: cargo check --lib --no-default-features

      - name: Check with default features
        run: cargo check --all-targets
