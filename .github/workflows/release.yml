name: Release

# Tag-driven release tier: pushing a `v*` tag builds the release artifacts for both Linux
# targets and attaches them to a *draft* GitHub release (a human reviews and publishes),
# pushes Docker images to GHCR tagged with the semver version, and publishes the crate to
# crates.io. Note the asymmetry: the GitHub release waits for a human, but the GHCR images and
# the crates.io version go out on the tag push and cannot be recalled (only overwritten and
# yanked respectively), so the tag is the point of no return, not the publish button.
#
# Binaries are extracted from the `export` stage of the project Dockerfiles rather than a
# fresh `cargo build`, so the published binaries inherit the exact *reproducible* build
# pipeline the images use:
#   * x86_64 (amd64): the StageX `Dockerfile` - full-source-bootstrapped, static musl,
#     bit-for-bit reproducible.
#   * aarch64 (arm64): the pinned `Dockerfile.arm64` - deterministic (digest-pinned base,
#     version-pinned apk toolchain, SOURCE_DATE_EPOCH, --build-id=none), static musl, built
#     natively on an arm64 runner. Not StageX-grade trust (upstream binaries, not
#     full-source-bootstrapped), but bit-for-bit reproducible.
# Each target ships a `.tar.gz` (reproducible tar: sorted, fixed mtime, root-owned) and a
# reproducible `.deb` (see scripts/build-deb.sh). Instead of a per-file `.sha256` sidecar the
# release carries one `SHA256SUMS` covering every artifact, in the standard `sha256sum -c`
# format (generated in the `release` job once all arches are gathered). Artifacts use one arch
# token per target - the Debian/Go names amd64/arm64, the fixed point set by the `.deb`
# convention - so a release lists `zecd-<ver>-linux-{amd64,arm64}.tar.gz` next to
# `zecd_<ver>_{amd64,arm64}.deb` (no rust target triples in filenames).
#
# It can also be run manually (Actions tab -> Release -> Run workflow), e.g. to dry-run the
# packaging without cutting a real tag: supply a `version` and, off by default, choose
# whether to also push the GHCR images. Manual runs still produce a *draft* release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (with or without a leading v), e.g. 0.1.0 or v0.1.0-rc1"
        required: true
        default: "0.0.0-test"
      push_images:
        description: "Also build and push the GHCR Docker images (off for a packaging dry-run)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  packages: write

jobs:
  # Resolve the version/tag once so tag pushes and manual dispatch share one source of truth.
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"          # strip a leading v if present
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} tag=v${VERSION}"

  # Build the reproducible binary + tarball + .deb for one Linux target.
  binary:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            dockerfile: Dockerfile
            arch: amd64
          - runner: ubuntu-24.04-arm
            dockerfile: Dockerfile.arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # Determinism anchor - matches the Dockerfiles and scripts/build-deb.sh.
      SOURCE_DATE_EPOCH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Extract the bare, reproducible binary from the Dockerfile's `export` stage.
      - name: Build binary (Docker export stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: export
          outputs: type=local,dest=out
          cache-from: type=gha,scope=binary-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=binary-${{ matrix.arch }}

      - name: Package tarball (reproducible)
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          STAGE="zecd-${VERSION}-linux-${{ matrix.arch }}"
          install -D -m 0755 out/zecd "$STAGE/zecd"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.txt zecd.example.toml "$STAGE/"
          # Reproducible tar: stable order, fixed mtime, root owner; gzip -n drops the
          # embedded name/timestamp.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf "$STAGE.tar" "$STAGE"
          gzip -9n "$STAGE.tar"

      - name: Build .deb (reproducible)
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          ./scripts/build-deb.sh out/zecd "$VERSION" "${{ matrix.arch }}" .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            zecd-*.tar.gz
            zecd_*.deb
          if-no-files-found: error

  # Collect every target's artifacts and attach them to a single draft release.
  release:
    needs: [setup, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the packaged release artifacts - NOT the `.dockerbuild` metadata
          # artifacts that docker/build-push-action auto-uploads from the `binary` jobs.
          # Without this filter, download-artifact also fetches the flaky `.dockerbuild`
          # download (which the release doesn't need) and fails the whole job.
          pattern: release-*
          path: dist
          merge-multiple: true

      # One SHA256SUMS covering every arch's artifacts, in the standard `sha256sum` format
      # (verify with `sha256sum -c SHA256SUMS`, or `shasum -a 256 -c` on macOS/BSD). Generated
      # here rather than per-target so a single file covers amd64 + arm64. Filenames are bare
      # (cd dist) so the file verifies against downloads sitting in one directory, and the list
      # is sorted by filename for a byte-stable, reproducible SHA256SUMS.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum zecd-*.tar.gz zecd_*.deb | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          # Explicit so manual dispatch (which has no tag ref) targets the right release;
          # a draft does not create the git tag until it is published.
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.tag }}
          files: |
            dist/zecd-*.tar.gz
            dist/zecd_*.deb
            dist/SHA256SUMS

  # Publish the crate to crates.io. Tag pushes only: a manual dispatch is a packaging dry-run
  # and must never upload, since a crates.io version can be yanked but never deleted or
  # replaced. Ordered after `release` so a packaging or artifact failure surfaces first, while
  # everything upstream of it is still reversible. Release candidates are published too;
  # `cargo install` and a caret requirement both skip a prerelease unless asked for by version.
  crates-io:
    needs: [setup, release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The tag names the version everywhere else in this workflow, so a manifest that
      # disagrees would publish under a number nothing else refers to.
      - name: Check the manifest version matches the tag
        run: |
          MANIFEST=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "zecd") | .version')
          echo "manifest=${MANIFEST} tag=${{ needs.setup.outputs.version }}"
          if [ "${MANIFEST}" != "${{ needs.setup.outputs.version }}" ]; then
            echo "::error::Cargo.toml says ${MANIFEST}, the tag says ${{ needs.setup.outputs.version }}"
            exit 1
          fi

      # A missing token FAILS the job rather than skipping quietly. Publishing was a manual
      # step before this job existed, and it was simply forgotten for two releases while every
      # other artifact shipped normally; a silent skip here would reproduce that exactly.
      # Re-running the workflow on an already-published version is a no-op, not an error.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, so ${VERSION} cannot be published"
            exit 1
          fi
          if curl -sf -H 'User-Agent: zecd-release-workflow' https://index.crates.io/ze/cd/zecd \
             | jq -e --arg v "${VERSION}" 'select(.vers == $v)' > /dev/null; then
            echo "zecd ${VERSION} is already on crates.io; nothing to do"
            exit 0
          fi
          cargo publish --locked

  # amd64: the reproducible StageX image, pushed *by digest* (no tags of its own). The
  # `manifest` job stitches amd64 + arm64 into one multi-arch tag, so consumers pull a single
  # `ghcr.io/.../zecd:<version>` and Docker picks the right arch. rewrite-timestamp + forced
  # compression keep the pushed layers deterministic; SBOM/provenance ride along on the digest.
  docker:
    needs: setup
    # Always on a tag push; on manual dispatch only when push_images was requested.
    if: github.event_name == 'push' || inputs.push_images
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          sbom: true
          provenance: mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # arm64: the static-musl Alpine image (Dockerfile.arm64), built natively on a GitHub arm64
  # runner and pushed by digest. StageX publishes no arm64 images yet, so this isn't
  # full-source-bootstrapped like amd64 - but it is bit-for-bit reproducible (pinned base + apk
  # toolchain).
  docker-arm64:
    needs: setup
    # Always on a tag push; on manual dispatch only when push_images was requested.
    if: github.event_name == 'push' || inputs.push_images
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.arm64
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # Combine the two arch digests into one multi-arch manifest under the real tags
  # (<version>, <major>.<minor>, and latest via metadata-action's default) - no -arm64 suffix.
  manifest:
    needs: [setup, docker, docker-arm64]
    if: github.event_name == 'push' || inputs.push_images
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.setup.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create and push the multi-arch manifest
        run: |
          tags=$(jq -r '.tags[] | "-t " + .' <<< '${{ steps.meta.outputs.json }}')
          docker buildx imagetools create $tags \
            ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.digest }} \
            ghcr.io/${{ github.repository }}@${{ needs.docker-arm64.outputs.digest }}

      - name: Show the resulting manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.version }}
