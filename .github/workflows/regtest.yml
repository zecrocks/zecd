name: Regtest E2E

# Live tier: brings up a zebra (Regtest) node and drives the real zecd binary over its JSON-RPC
# (zecd talks straight to zebrad - see regtest-harness/). Funding comes from a second zecd, run
# from a digest-pinned public release image, which owns the chain's coinbase, shields it into
# Orchard with `z_shieldcoinbase` and pays the wallet under test. It talks straight to the same
# node, so funding needs no lightwalletd; one is provisioned only for the light-mode leg, where the
# *zecd under test* is the light client.
# No zingo-infra: the harness mines via zebrad's
# Regtest-only `generate` RPC, so it has no zebra crate dependency and works against any zebrad
# release. zebrad + lightwalletd are extracted from their official Docker images.
#
# Runs on PRs and pushes to main against the pinned zebra image. The weekly schedule is the
# "big run": it tests BOTH the pinned image (re-validating the baseline) and zfnd/zebra:latest
# (an early-warning canary for upstream zebra changes), and - like manual dispatches - sets
# ZECD_REGTEST_EXTENDED=1 so the extended tests (reorg, multiwallet, stop/restore, watch-only) run too;
# on PR runs those skip in seconds (each spins its own zebra+lightwalletd stack).
#
# The note-scaling stress test (regtest_stress_notes) is heavier still - it builds thousands of
# notes and times multi-minute sends - so it is gated separately (ZECD_REGTEST_STRESS) and runs
# ONLY on a monthly cron (1st of the month) or a manual dispatch with the `stress` box ticked.
# It compiles on every run but skips in seconds otherwise.
#
# NU6.3 (ironwood) is ACTIVE on mainnet and testnet, so the regtest chain activates it too: the
# harness always configures the node with `"NU6.3"` at NU6_3_ACTIVATION_HEIGHT (8) and the zecd
# under test gets ZECD_REGTEST_NU63_HEIGHT to match. Every funded flow here therefore exercises the
# pool real users are on - a receive lands as an ironwood (V3) note, and every send builds a V6
# ironwood bundle. `regtest_ironwood` runs alongside the rest as one more test binary; it holds only
# the assertions the other flows can't imply (input/change pool pinning and the librustzcash#2554
# anchor-retention guard). There is no separate ironwood CI tier.

on:
  workflow_dispatch:
    inputs:
      zebra-image:
        description: "zfnd/zebra image tag to test against (e.g. 6.3.0, latest)"
        required: false
        default: ""
      zakura-image:
        description: "zakuracore/zakura image tag to test against (e.g. 1.2.0, latest)"
        required: false
        default: ""
      stress:
        description: "Run the heavy note-scaling stress test (regtest_stress_notes)"
        type: boolean
        default: false
      stress-note-count:
        description: "Notes to build in the stress test (blank = default 256)"
        required: false
        default: ""
      funder-image:
        description: "zecd release image the funder runs from; blank = the workflow default"
        required: false
        default: ""
  schedule:
    # Weekly canary against zfnd/zebra:latest (Mondays 06:17 UTC; an off-peak odd minute).
    - cron: "17 6 * * 1"
    # Monthly note-scaling stress run (1st of the month, 07:33 UTC). This cron - and only this
    # one - enables ZECD_REGTEST_STRESS; the weekly cron above leaves the stress test skipping.
    - cron: "33 7 1 * *"
  push:
    # Mainline only: feature branches (incl. feature/**) are covered by the pull_request trigger
    # below, so listing them here too would run every job twice on a PR push.
    branches: [main, master]
    paths:
      - "regtest-harness/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Only the Python harness scripts (conformance.py + the smoke scripts) feed the
      # regtest run; packaging/shell scripts under scripts/ don't, so scope to *.py.
      - "scripts/*.py"
      # This workflow runs `tests/embedded_regtest.rs` itself (the embedded-library e2e step
      # below), so a change to it must trigger this workflow - otherwise the one job that
      # executes that file never runs on the PR editing it, and it merges having never run.
      # Scoped to the file rather than `tests/**` because the rest of `tests/` is offline and
      # has no business starting a node; add any other file this workflow runs.
      - "tests/embedded_regtest.rs"
      - ".github/workflows/regtest.yml"
  pull_request:
    paths:
      - "regtest-harness/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/*.py"
      - "tests/embedded_regtest.rs"
      - ".github/workflows/regtest.yml"

# The pinned node images used by PR/push runs; the schedule runs each project's `latest` instead,
# and a manual dispatch can name any tag. Bumping a node = changing its one value here (the harness
# drives the node purely over JSON-RPC, so nothing else needs to move in lockstep).
#
# IMPORTANT: no workflow env var may start with `ZEBRA_` or `ZAKURA_` - zebrad/zakurad parse
# such-prefixed environment variables as config overrides and exit with "unknown field" on ones
# they don't recognise. (The harness also scrubs both prefixes before spawning the node, as a
# second line of defence.) NB `ZEBRAD_*`/`ZAKURAD_*` (with the trailing D) are safe - the prefix
# match requires the underscore right after `ZEBRA`/`ZAKURA`.
env:
  ZEBRAD_IMAGE_PINNED: "6.3.0"
  ZAKURAD_IMAGE_PINNED: "1.2.0"
  # The funding wallet is a *released* zecd, from its own digest-pinned GHCR image. Running a
  # release rather than the build under test keeps the two sides of every funded test independent -
  # a regression on this branch cannot mask itself by being present in both the wallet under test
  # and the wallet paying it - and makes the funded tier cross-version coverage: last release funds
  # HEAD, the shape a real deployment upgrades through. Bump this in the same PR as any consensus
  # change, or the funder stops understanding the chain it is funding. Prefer the newest release:
  # 0.5.2 was the first that rebroadcasts a transaction spending Ironwood notes, which every funder
  # payment is on this NU6.3-active chain - before it, a send whose broadcast failed was never
  # retransmitted and simply sat unmined until it expired. 0.6.0 additionally carries `config
  # check`, which is what makes `assert_funder_config_check_passes` (regtest-harness/src/lib.rs)
  # stop warn-and-skipping and start really asserting that the pinned release accepts the config
  # `write_funder_toml` writes for it - the enforcer behind that function's only-long-stable-keys
  # rule. 0.7.0 is the first release that nests librustzcash's files at <wallet>/zec/lrz/ and
  # migrates an existing flat wallet directory into it on first start, so a funder datadir this
  # pin builds is in the new layout; the chain-snapshot cache key below already includes this
  # image, so bumping the pin rebuilds the archive rather than restoring one the funder would
  # have to migrate. Resolve a new digest with:
  #   TOKEN=$(curl -sL "https://ghcr.io/token?scope=repository:zecrocks/zecd:pull&service=ghcr.io" | jq -r .token)
  #   curl -sI -H "Authorization: Bearer $TOKEN" \
  #     -H "Accept: application/vnd.oci.image.index.v1+json" \
  #     https://ghcr.io/v2/zecrocks/zecd/manifests/<tag> | grep -i docker-content-digest
  ZECD_FUNDER_IMAGE: ${{ inputs.funder-image || 'ghcr.io/zecrocks/zecd@sha256:4d4c854749f1e9ef6f2a5a56f3c67cae12cccf0da0966326679be95d0c36c708' }}  # 0.7.0
  # lightwalletd, built from source at this release tag. Needed only where the *zecd under test* is
  # a light client - the `zecd-lwd` suite and the dedicated regtest_lwd e2e - since the funder now
  # talks straight to the node. 0.5.0 is the first release serving the versioned lightwallet
  # protocol, which is what carries transparent and Ironwood data in compact blocks; the chain is
  # NU6.3-active throughout, so it also has to parse a V6 transaction, which the old v0.4.19 image
  # cannot.
  LIGHTWALLETD_VERSION: "v0.5.3"
  # The harness --test targets for the standard (zecd) suite. Both node legs (zebra and zakura)
  # run this full list; only the zecd-lwd leg overrides it with its own subset (see the matrix
  # `include` below). Extended/stress tests skip in seconds unless their gate is set.
  HARNESS_TESTS: "--test regtest_e2e --test regtest_binding --test regtest_migration --test regtest_funded --test regtest_ironwood --test regtest_proving_cache --test regtest_sapling --test regtest_transparent --test regtest_transparent_t2t --test regtest_transparent_sendmany_t2t --test regtest_transparent_gap --test regtest_transparent_offline_restore --test regtest_transparent_preexpose_responsive --test regtest_transparent_recovery_window --test regtest_shielding --test regtest_mergetoaddress --test regtest_coinbase --test regtest_hang --test regtest_reorg --test regtest_multiwallet --test regtest_restore --test regtest_watchonly --test regtest_stress_notes"

concurrency:
  group: regtest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    # A 16-vCPU org runner. This tier is ~23 independent node+wallet stacks, and it is bounded by
    # total CPU work over available cores rather than by slot count (see the REGTEST_JOBS comment
    # below for the measurement that establishes that) - so cores are the one input that actually
    # moves it. The stock 2-core runner can only ever run these one at a time: 3-way concurrency
    # there measured 22m21s against a 22m34s serial baseline, no gain whatsoever.
    # Overridable via the `REGTEST_RUNNER` repo variable (Settings > Secrets and variables >
    # Actions > Variables) - set it to `ubuntu-latest` to fall back to the stock runner, and drop
    # `REGTEST_JOBS` to 1 with it. Keep the two in lockstep in both directions.
    runs-on: ${{ vars.REGTEST_RUNNER || 'ubuntu-latest-16-cores' }}
    # NB: new harness test files must be added to the HARNESS_TESTS env list above (it enumerates
    # --test targets; nothing runs them implicitly).
    #
    # `node` runs the suite against each backend (zebra + zakura). Both speak the same JSON-RPC
    # dialect and take the same regtest config, so the harness code path is identical - only the
    # provisioned binary and `ZECD_REGTEST_NODE` differ. Both legs run the full HARNESS_TESTS
    # list, funded binaries included: the funder is a zecd talking straight to the node, so
    # lightwalletd's refusal to front zakura never reaches it.
    # The `image` dimension is "event" except on the weekly schedule, where both the pinned
    # baseline and `latest` run ("event" resolves the tag from the trigger: the node's dispatch
    # input or the pinned default).
    strategy:
      fail-fast: false
      matrix:
        node: [zebra, zakura]
        suite: [zecd, zecd-lwd]
        image: ${{ github.event_name == 'schedule' && fromJSON('["pinned", "latest"]') || fromJSON('["event"]') }}
        exclude:
          # No zakura light mode: lightwalletd hard-rejects zakura's `/Zakura/` subversion (see
          # the provisioning step), so a lightwalletd-fronted zecd can't exist on that node.
          - node: zakura
            suite: zecd-lwd
        include:
          # Light mode: the same funded/conformance flow plus the transparent suites (incl. the
          # regtest_transparent_gap regression trap) rerun with zecd on a lightwalletd upstream
          # (ZECD_REGTEST_BACKEND=lwd), and the dedicated regtest_lwd e2e (equivalence vs a
          # zebra-backed twin, outage/reconnect, the offline-window sweep on both server
          # generations). A parallel leg, so PR wall-time is unchanged. The zecd suite falls
          # back to the full HARNESS_TESTS list (env above).
          - suite: zecd-lwd
            backend: lwd
            # regtest_multibackend is extended-tier (it skips in seconds otherwise) and lives
            # only here: it is the one binary needing a lightwalletd AND a zebra endpoint in the
            # same daemon, and lightwalletd is provisioned only on this leg.
            tests: --test regtest_lwd --test regtest_funded --test regtest_transparent --test regtest_transparent_t2t --test regtest_transparent_sendmany_t2t --test regtest_transparent_gap --test regtest_transparent_offline_restore --test regtest_shielding --test regtest_mergetoaddress --test regtest_multibackend
            # Heavier per-slot than the zebra suite (an extra lightwalletd per stack, and
            # regtest_lwd itself runs two lightwalletds plus a second zebra-backed zecd twin), so
            # this leg keeps its own slot count rather than the default below. 8 is the 16-core
            # equivalent of the 4 this was tuned to on the 8-core runner - scaled with the runner,
            # like everything else here. Its list is only 10 binaries, so a lower ceiling costs
            # little; drop it back if the per-binary timing table shows binaries starved rather
            # than slots idle.
            jobs: 8
    name: regtest (${{ matrix.node }}, ${{ matrix.suite }}, ${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4

      # What this leg actually got. Recorded because the tier's wall clock is now a function of
      # the runner's cores and RAM (see REGTEST_JOBS below), so a run whose timings look wrong is
      # first a question of what hardware it landed on.
      - name: Report runner hardware
        run: |
          echo "runner:  ${{ runner.name }}"
          echo "cores:   $(nproc)"
          echo "memory:  $(free -g | awk '/^Mem:/ {print $2}') GiB"
          df -h / | tail -1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            regtest-harness

      # Release build: debug Orchard/Sapling proving is >20s; release keeps the harness snappy.
      - name: Build zecd (release)
        run: cargo build --release --bin zecd

      # Pick the node image + tag for this leg. `node` selects the project (zebra/zakura), which
      # fixes the image repo, pinned tag, binary name and the env var the harness reads. The
      # `image` dimension names the tag outright on the weekly schedule (pinned + latest legs);
      # otherwise ("event") it comes from the trigger: the node's manual-dispatch input, or the
      # pinned tag for PR/push runs.
      - name: Select node image
        run: |
          case "${{ matrix.node }}" in
            zebra)
              repo="zfnd/zebra"; pinned="$ZEBRAD_IMAGE_PINNED"; binname="zebrad"
              binenv="ZEBRAD_BIN"; dispatch_tag="${{ inputs.zebra-image }}" ;;
            zakura)
              repo="zakuracore/zakura"; pinned="$ZAKURAD_IMAGE_PINNED"; binname="zakurad"
              binenv="ZAKURAD_BIN"; dispatch_tag="${{ inputs.zakura-image }}" ;;
            *) echo "::error::unknown node ${{ matrix.node }}"; exit 1 ;;
          esac
          case "${{ matrix.image }}" in
            pinned) tag="$pinned" ;;
            latest) tag="latest" ;;
            *)
              case "${{ github.event_name }}" in
                workflow_dispatch) tag="${dispatch_tag:-$pinned}" ;;
                *) tag="$pinned" ;;
              esac
              ;;
          esac
          echo "Testing zecd against $repo:$tag (node=${{ matrix.node }})"
          echo "NODE_IMAGE=$repo:$tag" >> "$GITHUB_ENV"
          echo "NODE_BIN_NAME=$binname" >> "$GITHUB_ENV"
          echo "NODE_BIN_ENV=$binenv" >> "$GITHUB_ENV"

      # Extract the selected node from its official Docker image, plus lightwalletd. The harness
      # drives the node over JSON-RPC only (mining via the Regtest-only `generate` RPC), so any
      # zebrad/zakurad release works. The node binary is read from $NODE_BIN_ENV (ZEBRAD_BIN or
      # ZAKURAD_BIN).
      #
      # lightwalletd now matters only where the *zecd under test* is a light client: the
      # `zecd-lwd` suite. It hard-rejects any node whose `getinfo.subversion` isn't zcashd/zebrad -
      # including zakura's `/Zakura:x.y.z/` - and exits fatally, which is why there is no
      # zakura+zecd-lwd leg (see the matrix `exclude`). The funder is a zecd on the node's own
      # JSON-RPC, so funding no longer depends on it at all - which is what lets the zakura leg run
      # the funded binaries and the coinbase suite alongside the zebra one.
      - name: Provision node + funder from images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            img="$1"; name="$2"; out="$RUNNER_TEMP/bin/$name"
            docker pull -q "$img"
            cid=$(docker create "$img")
            rel=$(docker export "$cid" | tar -tf - | grep -m1 -E "(^|/)${name}\$" || true)
            if [ -z "$rel" ]; then echo "::error::could not locate $name in $img"; docker rm "$cid" >/dev/null; exit 1; fi
            docker cp "$cid:/$rel" "$out"
            docker rm "$cid" >/dev/null
            chmod +x "$out"
            echo "$name -> $out"; file -b "$out" || true
          }
          extract "$NODE_IMAGE" "$NODE_BIN_NAME"
          echo "$NODE_BIN_ENV=$RUNNER_TEMP/bin/$NODE_BIN_NAME" >> "$GITHUB_ENV"
          # The funding wallet: a released zecd, from the digest-pinned public GHCR image. The
          # harness falls back to the built binary when this is unset, so a local `cargo test`
          # needs no image at all - CI pins one to keep funder and wallet-under-test independent.
          extract "$ZECD_FUNDER_IMAGE" zecd
          echo "ZECD_FUNDER_BIN=$RUNNER_TEMP/bin/zecd" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/zecd" --version
          # lightwalletd is built from source below (LIGHTWALLETD_VERSION) rather than extracted -
          # see the note on that step for why it is the odd one out here.

      # Build lightwalletd at LIGHTWALLETD_VERSION from source. It is the upstream for the zecd
      # under test on the light-mode leg - the NU6.3-active chain needs a lightwalletd that parses
      # V6.
      #
      # This is the one binary the tier does not extract from an image, and it is a deliberate
      # choice rather than a missing image: `electriccoinco/lightwalletd` does publish every 0.5.x
      # tag (it stopped at v0.4.19, which cannot parse V6, only until 2026-07-26). But that image
      # is single-stage - it ships the Go toolchain and the source tree it built from, ~445 MB of
      # layers, to deliver one 25 MB binary - and the harness runs lightwalletd as a host process,
      # not a container, so an image buys nothing structurally: we would extract a binary from it
      # either way. Building costs 22-34s on a cache miss (measured), and the cache is keyed on
      # LIGHTWALLETD_VERSION, so every run that does not bump the pin restores a 25 MB binary
      # instead. Extracting would trade that for a ~445 MB pull on every light-mode run. Revisit if
      # upstream ships a slim runtime image.
      - name: Cache the release-built lightwalletd
        id: lwd-master-bin
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bin/lightwalletd-release
          key: lwd-release-bin-${{ runner.os }}-${{ env.LIGHTWALLETD_VERSION }}

      - name: Build lightwalletd from its release tag
        if: steps.lwd-master-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/zcash/lightwalletd.git "$RUNNER_TEMP/lightwalletd-src"
          git -C "$RUNNER_TEMP/lightwalletd-src" checkout "$LIGHTWALLETD_VERSION"
          (cd "$RUNNER_TEMP/lightwalletd-src" && go build -o "$RUNNER_TEMP/bin/lightwalletd-release" .)
          file -b "$RUNNER_TEMP/bin/lightwalletd-release" || true

      # lightwalletd is only usable in front of zebra - it hard-rejects zakura's `/Zakura/`
      # subversion - so the zakura leg leaves LIGHTWALLETD_BIN unset. Nothing on that leg needs it
      # any more: the only binaries that do are the light-mode ones, and there is no
      # zakura+zecd-lwd leg.
      - name: Select the lightwalletd binary
        run: |
          if [ "${{ matrix.node }}" = "zebra" ]; then
            echo "LIGHTWALLETD_BIN=$RUNNER_TEMP/bin/lightwalletd-release" >> "$GITHUB_ENV"
          else
            echo "node=${{ matrix.node }}: skipping lightwalletd (it rejects this node's subversion); nothing on this leg needs it"
          fi

      # Every binary that calls `start_funded_chain` needs the same starting state: a chain whose
      # funder holds a spendable shielded balance. Building it means mining past the 100-block
      # coinbase maturity (consensus, so it cannot be shortened), starting the funder, shielding
      # its coinbase and ageing the note - ~89s, paid identically by 12 binaries on the zebra leg.
      # Build it once here instead, and let the binaries restore a copy.
      #
      # The cache key covers everything that can change what the chain *is*: the node image, the
      # funder image, and the harness source that shapes it (activation heights, coinbase counts,
      # the funder's own config). A harness edit therefore rebuilds rather than restoring a
      # snapshot that no longer matches the code reading it - most pull requests do not touch
      # that file, so the cache still hits on the runs where it matters.
      #
      # Only legs that actually run a funded binary need it. That is a property of the leg's
      # *test list*, not of the node, so ask the sources rather than naming a node: both node legs
      # run funded binaries today, but a leg that trims its list back should stop building a
      # snapshot nothing restores, and a leg that gains one must start - a hard-coded guard gets
      # exactly one of those wrong silently, every funded binary quietly falling back to its own
      # bring-up with nothing to warn anyone.
      - name: Decide whether this leg needs the funded chain snapshot
        id: snapshot-needed
        env:
          LEG_TESTS: ${{ matrix.tests || env.HARNESS_TESTS }}
        run: |
          needed=false
          for t in $LEG_TESTS; do
            [ "$t" = "--test" ] && continue
            if grep -q 'start_funded_chain' "regtest-harness/tests/$t.rs" 2>/dev/null; then
              needed=true
              echo "$t calls start_funded_chain -> this leg needs the snapshot"
              break
            fi
          done
          [ "$needed" = true ] || echo "no binary on this leg calls start_funded_chain -> no snapshot"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Cache the funded chain snapshot
        if: steps.snapshot-needed.outputs.needed == 'true'
        id: chain-snapshot
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chain-snapshot
          key: chain-snapshot-v1-${{ runner.os }}-${{ matrix.node }}-${{ env.NODE_IMAGE }}-${{ env.ZECD_FUNDER_IMAGE }}-${{ hashFiles('regtest-harness/src/lib.rs') }}

      - name: Build the funded chain snapshot
        if: steps.snapshot-needed.outputs.needed == 'true' && steps.chain-snapshot.outputs.cache-hit != 'true'
        env:
          ZECD_REGTEST_NU63_HEIGHT: "8"
          ZECD_REGTEST_NODE: ${{ matrix.node }}
        run: |
          cargo run --release --locked --manifest-path regtest-harness/Cargo.toml \
            --bin build-chain-snapshot -- "$RUNNER_TEMP/chain-snapshot"

      # The funded test also runs scripts/conformance.py (python3, stdlib-only) against the
      # live daemon, so the full Bitcoin-Core wire-format suite is exercised here in CI.
      - name: Run regtest end-to-end harness
        env:
          ZECD_BIN: ${{ github.workspace }}/target/release/zecd
          # Activate NU6.3 (ironwood) at height 8 on the regtest chain, matching the node config the
          # harness writes (regtest-harness's NU6_3_ACTIVATION_HEIGHT). The funder is a zecd too and
          # inherits this variable, so all three agree by construction - and they MUST: a mismatch
          # diverges the NU6.3 consensus branch id and the node rejects the transactions.
          ZECD_REGTEST_NU63_HEIGHT: "8"
          # Select the backend for this matrix leg (zebra/zakura); the harness resolves the node
          # binary from the matching env var (ZEBRAD_BIN / ZAKURAD_BIN, exported above).
          ZECD_REGTEST_NODE: ${{ matrix.node }}
          # NB the node's logs (ZEBRAD_STDERR - the harness's hook name for both backends) are set
          # per test binary by run-tests.sh, into REGTEST_LOG_DIR below; with several stacks live
          # at once a single shared file would just be the last writer's. The driver tails the log
          # of any binary that fails.
          # Stream zecd's own logs into the job output (the harness inherits its stdio; combined
          # with `--nocapture` below they appear in the run log). Focus debug on the transparent
          # receive paths (mempool attribution, the getaddresstxids enhancement) so the volume
          # stays manageable while a transparent-receive failure is diagnosable.
          ZECD_STDERR: "1"
          RUST_LOG: "zecd=info,zecd::wallet::actor=debug,zecd::chain=debug"
          # The extended tier (reorg, multiwallet, stop/restore, watch-only) runs on the weekly "big
          # run" and on manual dispatches; all PR/push runs (incl. the ironwood dev branch) let those
          # tests skip in seconds. The dev branch deliberately does NOT force extended: its reorg
          # test is timing/finalization-boundary sensitive and flakes, which would redden the PR for
          # reasons unrelated to the ironwood work and obscure that signal. (It still runs weekly.)
          ZECD_REGTEST_EXTENDED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          # The heavy note-scaling stress test runs ONLY on the monthly cron (the 1st-of-month
          # schedule) and on a manual dispatch that ticks `stress` - never on push/PR, and not on
          # the weekly cron. Its note target is `stress-note-count` on dispatch (blank → default 256).
          ZECD_REGTEST_STRESS: ${{ (github.event.schedule == '33 7 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.stress)) && '1' || '' }}
          ZECD_STRESS_NOTE_COUNT: ${{ inputs.stress-note-count }}
          # The shielded-coinbase e2e needs a zebrad whose block template builds valid shielded
          # coinbase (zebra >= 6.0.0; 5.0.0's Orchard coinbase proof fails its own validation),
          # and self-skips otherwise. The pinned image (6.3.0) and `latest` both have the
          # capability, so a skip is a failure everywhere except a manual dispatch that names a
          # custom (possibly older) image - guards against the test silently never running. Both
          # node legs run the coinbase suite, and zakura inherits zebra's template code, so the
          # same expectation holds on either.
          ZECD_REGTEST_REQUIRE_SHIELDED_COINBASE: ${{ (github.event_name != 'workflow_dispatch' || inputs.zebra-image == '') && '1' || '' }}
          # Light mode: the zecd-lwd suite reruns the opted-in tests with zecd on a dedicated
          # lightwalletd upstream instead of the node's JSON-RPC (empty = the node, the default).
          ZECD_REGTEST_BACKEND: ${{ matrix.backend || '' }}
          # A prebuilt funded chain for start_funded_chain to restore (built or cache-restored
          # above; empty on a leg that runs no funded binary, where there is nothing to restore
          # it). A snapshot that is stale, truncated or from the wrong node is not fatal - the
          # harness verifies what it restored and falls back to a live bring-up - so the worst a
          # bad one costs is the time it was meant to save.
          ZECD_REGTEST_CHAIN_SNAPSHOT: ${{ steps.snapshot-needed.outputs.needed == 'true' && format('{0}/chain-snapshot', runner.temp) || '' }}
          # The node binary (ZEBRAD_BIN/ZAKURAD_BIN) and LIGHTWALLETD_BIN are exported by the
          # provisioning steps above.
          #
          # How many test binaries run at once. Each one is a whole zebrad(+lightwalletd)+zecd
          # stack that spends most of its wall clock waiting on that stack rather than burning
          # CPU, so the tier overlaps well - but only as far as the runner has cores and RAM for
          # it. Raise REGTEST_JOBS in lockstep with REGTEST_RUNNER, never past it: an oversubscribed
          # runner does not just run slower, it pushes the harness's sync/confirmation waits past
          # their timeouts and turns into flakes. The per-binary wall-clock table the driver prints
          # at the end of the step is the tuning input.
          #
          # Scale this WITH the runner's cores, never independently of them. The tier is bounded
          # by total CPU work over available cores, not by slot count - measured back to back on
          # the zebra leg, same commit, 23 binaries, on the 8-vCPU runner:
          #   6 jobs -> total work 2946s, longest binary 374s, elapsed 524s
          #   8 jobs -> total work 3755s, longest binary 478s, elapsed 521s
          # Three seconds for a third more slots, because every binary inflated 22-38% (the short
          # ones too): the extra slots divided the same CPU instead of filling idle capacity, and
          # the longest binary - the thing extra slots were meant to hide behind - grew 28% along
          # with the rest. The premise in run-tests.sh's header ("spends most of its wall clock
          # *waiting* on that stack") predates NU6.3 and the zecd funder; a funded binary now runs
          # TWO proving daemons, each building proving keys and proving its own sends.
          #
          # 12 keeps the ~1.33 cores-per-slot ratio that 6-on-8 established, which is the ratio
          # the measurement above says matters. Past that the tier is bounded by its longest
          # binary anyway (regtest_coinbase, ~374s), so extra slots would again be pure
          # contention. NB at 16 cores the tier flips back to being tail-bound, which is the one
          # regime where *splitting* a slow binary starts paying again - it does not pay while
          # work-bound, since a new binary adds a whole extra chain bring-up to the CPU total.
          #
          # Also still live from the earlier tuning: REGTEST_TEST_THREADS=2 was tried and
          # reverted after starving the one-test regtest_sapling into a bad getunconfirmedbalance
          # assertion. Raise slots or threads, never both, and never past what the runner has.
          # The light-mode leg runs a lower concurrency than the tuned-for-zebra default: each of
          # its binaries brings up a lightwalletd *in addition to* the node+zecd stack (regtest_lwd
          # runs two lightwalletds and a second zebra-backed zecd twin), so a slot there costs
          # meaningfully more RAM and processes than the zebra suite the 6 was measured against.
          # Its list is also only 6 binaries, so the ceiling costs little wall clock. Raise it if
          # the per-binary timing table shows slots idling.
          REGTEST_JOBS: ${{ matrix.jobs || vars.REGTEST_JOBS || 12 }}
          REGTEST_LOG_DIR: ${{ runner.temp }}/regtest-logs
        # run-tests.sh builds the binaries once (--locked, against the committed lock) and then
        # runs them REGTEST_JOBS at a time, each in its own slice of the loopback port range. It
        # always runs every binary - the old `--no-fail-fast`, so one flaky test can't mask the
        # rest - and exits non-zero if any failed. The lwd leg passes its own shorter list.
        run: regtest-harness/run-tests.sh ${{ matrix.tests || env.HARNESS_TESTS }}

      # The embedded-library e2e: init_wallet -> NodeBuilder::start -> one typed call of each
      # shape through Node::call, against a throwaway zebrad chain (tests/embedded_regtest.rs).
      # In-crate rather than in the harness because the harness is deliberately a black-box
      # driver of the binary and cannot link the library. Zebra leg only (it needs exactly one
      # zebrad, provisioned above as ZEBRAD_BIN). NB no ZECD_REGTEST_NU63_HEIGHT here: the
      # test's chain stays pre-NU6.3 by design, and the two sides must agree.
      - name: Run embedded-library end-to-end test
        if: matrix.node == 'zebra' && matrix.suite == 'zecd'
        env:
          ZECD_EMBEDDED_REGTEST: "1"
        run: cargo test --release --locked --test embedded_regtest -- --ignored --nocapture

      # run-tests.sh already replays each failing binary's output and tails its node log, so this
      # only adds what it can't know about: the machine's state, and whether a binary died so
      # early it left nothing behind.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="
          df -h / "$RUNNER_TEMP" || true
          echo "== memory =="
          free -g || true
          echo "== captured logs (${{ matrix.node }}) =="
          ls -la "$RUNNER_TEMP/regtest-logs" 2>/dev/null || echo "(no logs were written)"
