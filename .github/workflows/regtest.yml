name: Regtest E2E

# Live tier: brings up a zebra (Regtest) node and drives the real zecd binary over its JSON-RPC
# (zecd talks straight to zebrad - see regtest-harness/). It also builds zcash-devtool
# (regtest-enabled) as a funding wallet, used to shield a mined transparent coinbase into Orchard
# and fund zecd (the funded e2e). The funder speaks lightwalletd's gRPC, so the funded tests also
# run a lightwalletd in front of the same zebra - but the zecd under test always uses zebra.
# No zingo-infra: the harness mines via zebrad's
# Regtest-only `generate` RPC, so it has no zebra crate dependency and works against any zebrad
# release. zebrad + lightwalletd are extracted from their official Docker images.
#
# Runs on PRs and pushes to main against the pinned zebra image. The weekly schedule is the
# "big run": it tests BOTH the pinned image (re-validating the baseline) and zfnd/zebra:latest
# (an early-warning canary for upstream zebra changes), and - like manual dispatches - sets
# ZECD_REGTEST_EXTENDED=1 so the extended tests (reorg, multiwallet, stop/restore, watch-only) run too;
# on PR runs those skip in seconds (each spins its own zebra+lightwalletd stack).
#
# The note-scaling stress test (regtest_stress_notes) is heavier still - it builds thousands of
# notes and times multi-minute sends - so it is gated separately (ZECD_REGTEST_STRESS) and runs
# ONLY on a monthly cron (1st of the month) or a manual dispatch with the `stress` box ticked.
# It compiles on every run but skips in seconds otherwise.
#
# A separate `regtest-ironwood` job (schedule + manual dispatch, plus the mainline) builds zecd
# with the ironwood scan/send paths - which are compiled unconditionally now - against the official
# zcash/librustzcash ironwood RC (no `nu6.3` cfg needed any more) - and runs the NU6.3 receive+send
# e2e against the ironwood toolchain images - see that job's header.

on:
  workflow_dispatch:
    inputs:
      zebra-image:
        description: "zfnd/zebra image tag to test against (e.g. 6.2.2, latest)"
        required: false
        default: ""
      zakura-image:
        description: "zakuracore/zakura image tag to test against (e.g. 1.0.5, latest)"
        required: false
        default: ""
      stress:
        description: "Run the heavy note-scaling stress test (regtest_stress_notes)"
        type: boolean
        default: false
      stress-note-count:
        description: "Notes to build in the stress test (blank = default 256)"
        required: false
        default: ""
      zebra-ironwood-image:
        description: "Ironwood tier: NU6.3-capable zebrad image (default zfnd/zebra:6.2.2); blank = the job default"
        required: false
        default: ""
      lwd-ironwood-image:
        description: "Ironwood tier: V6-aware lightwalletd image; blank = the job default"
        required: false
        default: ""
      devtool-ironwood-image:
        description: "Ironwood tier: regtest-aware zcash-devtool image; blank = the job default"
        required: false
        default: ""
  schedule:
    # Weekly canary against zfnd/zebra:latest (Mondays 06:17 UTC; an off-peak odd minute).
    - cron: "17 6 * * 1"
    # Monthly note-scaling stress run (1st of the month, 07:33 UTC). This cron - and only this
    # one - enables ZECD_REGTEST_STRESS; the weekly cron above leaves the stress test skipping.
    - cron: "33 7 1 * *"
  push:
    # Mainline only: feature branches (incl. feature/**) are covered by the pull_request trigger
    # below, so listing them here too would run every job twice on a PR push.
    branches: [main, master]
    paths:
      - "regtest-harness/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # Only the Python harness scripts (conformance.py + the smoke scripts) feed the
      # regtest run; packaging/shell scripts under scripts/ don't, so scope to *.py.
      - "scripts/*.py"
      - ".github/workflows/regtest.yml"
  pull_request:
    paths:
      - "regtest-harness/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/*.py"
      - ".github/workflows/regtest.yml"

# The pinned node images used by PR/push runs; the schedule runs each project's `latest` instead,
# and a manual dispatch can name any tag. Bumping a node = changing its one value here (the harness
# drives the node purely over JSON-RPC, so nothing else needs to move in lockstep).
#
# IMPORTANT: no workflow env var may start with `ZEBRA_` or `ZAKURA_` - zebrad/zakurad parse
# such-prefixed environment variables as config overrides and exit with "unknown field" on ones
# they don't recognise. (The harness also scrubs both prefixes before spawning the node, as a
# second line of defence.) NB `ZEBRAD_*`/`ZAKURAD_*` (with the trailing D) are safe - the prefix
# match requires the underscore right after `ZEBRA`/`ZAKURA`.
env:
  ZEBRAD_IMAGE_PINNED: "6.2.2"
  ZAKURAD_IMAGE_PINNED: "1.0.5"
  # The harness --test targets. Identical for both backends; the lightwalletd-funded tests skip
  # themselves on the zakura leg (see the provisioning step - lightwalletd can't front zakura's
  # `/Zakura/` subversion), and extended/stress tests skip in seconds unless their gate is set.
  HARNESS_TESTS: "--test regtest_e2e --test regtest_binding --test regtest_funded --test regtest_proving_cache --test regtest_sapling --test regtest_transparent --test regtest_transparent_t2t --test regtest_transparent_sendmany_t2t --test regtest_transparent_gap --test regtest_transparent_offline_restore --test regtest_transparent_preexpose_responsive --test regtest_transparent_recovery_window --test regtest_coinbase --test regtest_hang --test regtest_reorg --test regtest_multiwallet --test regtest_restore --test regtest_watchonly --test regtest_stress_notes"

concurrency:
  group: regtest-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regtest:
    # An 8-vCPU/32GiB org runner, because this tier is ~18 independent node+wallet stacks and the
    # default 2-core runner can only ever run them one at a time (measured: 3-way concurrency on
    # 2 cores is 22m21s against a 22m34s serial baseline - no gain whatsoever). On 8 cores the same
    # work is 5m42s. Overridable via the `REGTEST_RUNNER` repo variable (Settings > Secrets and
    # variables > Actions > Variables) - set it to `ubuntu-latest` to fall back to the stock runner,
    # and drop `REGTEST_JOBS` to 1 with it.
    runs-on: ${{ vars.REGTEST_RUNNER || 'ubuntu-latest-8-cores' }}
    # NB: new harness test files must be added to the HARNESS_TESTS env list above (it enumerates
    # --test targets; nothing runs them implicitly).
    #
    # `node` runs the whole suite against each backend (zebra + zakura). Both speak the same
    # JSON-RPC dialect and take the same regtest config, so the harness code path is identical -
    # only the provisioned binary and `ZECD_REGTEST_NODE` differ. (The lightwalletd-funded tests
    # skip on the zakura leg - lightwalletd rejects zakura's subversion; see the provisioning step.)
    # The `image` dimension is "event" except on the weekly schedule, where both the pinned
    # baseline and `latest` run ("event" resolves the tag from the trigger: the node's dispatch
    # input or the pinned default).
    strategy:
      fail-fast: false
      matrix:
        node: [zebra, zakura]
        image: ${{ github.event_name == 'schedule' && fromJSON('["pinned", "latest"]') || fromJSON('["event"]') }}
    name: regtest (${{ matrix.node }}, ${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4

      # What this leg actually got. Recorded because the tier's wall clock is now a function of
      # the runner's cores and RAM (see REGTEST_JOBS below), so a run whose timings look wrong is
      # first a question of what hardware it landed on.
      - name: Report runner hardware
        run: |
          echo "runner:  ${{ runner.name }}"
          echo "cores:   $(nproc)"
          echo "memory:  $(free -g | awk '/^Mem:/ {print $2}') GiB"
          df -h / | tail -1

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            regtest-harness
            zcash-devtool

      # Release build: debug Orchard/Sapling proving is >20s; release keeps the harness snappy.
      - name: Build zecd (release)
        run: cargo build --release --bin zecd

      # The funding wallet: zcash-devtool with regtest support (PR zecrocks/zcash-devtool#1).
      # It shields a mined transparent coinbase into Orchard and sends it to zecd, since regtest
      # can't mine an Orchard coinbase zecd would scan.
      # Pinned to a commit SHA (branch sleepy-faraday-T6HUy) so the build can't change
      # or vanish under us. TODO: switch `ref` to a main-branch SHA once zcash-devtool#1 merges.
      - name: Checkout zcash-devtool (funder)
        uses: actions/checkout@v4
        with:
          repository: zecrocks/zcash-devtool
          ref: 7ca3ce28ed9f606cdb1e1a6c8ae087cb2c5a2973
          path: zcash-devtool

      # Cache the funder binary keyed on its commit, so devtool is built once per devtool change
      # and skipped entirely on every other run (it rarely changes between zecd runs). On a miss,
      # rust-cache (above) still has its dependency tree, so the rebuild is just devtool's own crate.
      - name: Resolve devtool commit
        run: echo "DEVTOOL_SHA=$(git -C zcash-devtool rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache the funder binary
        id: devtool-bin
        uses: actions/cache@v4
        with:
          path: zcash-devtool/target/release/zcash-devtool
          key: devtool-bin-${{ runner.os }}-${{ env.DEVTOOL_SHA }}

      - name: Build zcash-devtool (funder)
        if: steps.devtool-bin.outputs.cache-hit != 'true'
        run: cargo build --release --manifest-path zcash-devtool/Cargo.toml --bin zcash-devtool

      # Pick the node image + tag for this leg. `node` selects the project (zebra/zakura), which
      # fixes the image repo, pinned tag, binary name and the env var the harness reads. The
      # `image` dimension names the tag outright on the weekly schedule (pinned + latest legs);
      # otherwise ("event") it comes from the trigger: the node's manual-dispatch input, or the
      # pinned tag for PR/push runs.
      - name: Select node image
        run: |
          case "${{ matrix.node }}" in
            zebra)
              repo="zfnd/zebra"; pinned="$ZEBRAD_IMAGE_PINNED"; binname="zebrad"
              binenv="ZEBRAD_BIN"; dispatch_tag="${{ inputs.zebra-image }}" ;;
            zakura)
              repo="zakuracore/zakura"; pinned="$ZAKURAD_IMAGE_PINNED"; binname="zakurad"
              binenv="ZAKURAD_BIN"; dispatch_tag="${{ inputs.zakura-image }}" ;;
            *) echo "::error::unknown node ${{ matrix.node }}"; exit 1 ;;
          esac
          case "${{ matrix.image }}" in
            pinned) tag="$pinned" ;;
            latest) tag="latest" ;;
            *)
              case "${{ github.event_name }}" in
                workflow_dispatch) tag="${dispatch_tag:-$pinned}" ;;
                *) tag="$pinned" ;;
              esac
              ;;
          esac
          echo "Testing zecd against $repo:$tag (node=${{ matrix.node }})"
          echo "NODE_IMAGE=$repo:$tag" >> "$GITHUB_ENV"
          echo "NODE_BIN_NAME=$binname" >> "$GITHUB_ENV"
          echo "NODE_BIN_ENV=$binenv" >> "$GITHUB_ENV"

      # Extract the selected node from its official Docker image, plus lightwalletd. The harness
      # drives the node over JSON-RPC only (mining via the Regtest-only `generate` RPC), so any
      # zebrad/zakurad release works. The node binary is read from $NODE_BIN_ENV (ZEBRAD_BIN or
      # ZAKURAD_BIN).
      #
      # lightwalletd is only used by the devtool *funder* (it fronts the node so devtool's gRPC
      # wallet can shield+send Orchard funds into zecd). lightwalletd v0.4.19 hard-rejects any node
      # whose `getinfo.subversion` isn't zcashd/zebrad - including zakura's `/Zakura:x.y.z/` - and
      # exits fatally, so we can't run the funder in front of zakura. We therefore only provision
      # LIGHTWALLETD_BIN on the zebra leg; on zakura the funder-dependent tests skip themselves
      # (their existing `resolve_bin("LIGHTWALLETD_BIN")` guard), while every direct-RPC test
      # (sync/addresses/reorg/multiwallet/restore/watch-only/transparent-recovery/...) still runs.
      # (The coinbase suite is also zebra-only - kept off zakura via its ZEBRAD_BIN guard - because
      # the transparent-coinbase maturity+shield flow was flaky against zakura in testing.) zecd
      # itself talks to zakura directly and needs no lightwalletd; this is purely a limit of the
      # test funder. A zakura-compatible lightwalletd would let the funded tests run here too.
      - name: Provision node + lightwalletd from images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            img="$1"; name="$2"; out="$RUNNER_TEMP/bin/$name"
            docker pull -q "$img"
            cid=$(docker create "$img")
            rel=$(docker export "$cid" | tar -tf - | grep -m1 -E "(^|/)${name}\$" || true)
            if [ -z "$rel" ]; then echo "::error::could not locate $name in $img"; docker rm "$cid" >/dev/null; exit 1; fi
            docker cp "$cid:/$rel" "$out"
            docker rm "$cid" >/dev/null
            chmod +x "$out"
            echo "$name -> $out"; file -b "$out" || true
          }
          extract "$NODE_IMAGE" "$NODE_BIN_NAME"
          echo "$NODE_BIN_ENV=$RUNNER_TEMP/bin/$NODE_BIN_NAME" >> "$GITHUB_ENV"
          if [ "${{ matrix.node }}" = "zebra" ]; then
            extract electriccoinco/lightwalletd:v0.4.19 lightwalletd
            echo "LIGHTWALLETD_BIN=$RUNNER_TEMP/bin/lightwalletd" >> "$GITHUB_ENV"
          else
            echo "node=${{ matrix.node }}: skipping lightwalletd (it rejects this node's subversion); funder tests will self-skip"
          fi

      # The funded test also runs scripts/conformance.py (python3, stdlib-only) against the
      # live daemon, so the full Bitcoin-Core wire-format suite is exercised here in CI.
      - name: Run regtest end-to-end harness
        env:
          ZECD_BIN: ${{ github.workspace }}/target/release/zecd
          DEVTOOL_BIN: ${{ github.workspace }}/zcash-devtool/target/release/zcash-devtool
          # Select the backend for this matrix leg (zebra/zakura); the harness resolves the node
          # binary from the matching env var (ZEBRAD_BIN / ZAKURAD_BIN, exported above).
          ZECD_REGTEST_NODE: ${{ matrix.node }}
          # NB the node's logs (ZEBRAD_STDERR - the harness's hook name for both backends) are set
          # per test binary by run-tests.sh, into REGTEST_LOG_DIR below; with several stacks live
          # at once a single shared file would just be the last writer's. The driver tails the log
          # of any binary that fails.
          # Stream zecd's own logs into the job output (the harness inherits its stdio; combined
          # with `--nocapture` below they appear in the run log). Focus debug on the transparent
          # receive paths (mempool attribution, the getaddresstxids enhancement) so the volume
          # stays manageable while a transparent-receive failure is diagnosable.
          ZECD_STDERR: "1"
          RUST_LOG: "zecd=info,zecd::wallet::actor=debug,zecd::chain=debug"
          # The extended tier (reorg, multiwallet, stop/restore, watch-only) runs on the weekly "big
          # run" and on manual dispatches; all PR/push runs (incl. the ironwood dev branch) let those
          # tests skip in seconds. The dev branch deliberately does NOT force extended: its reorg
          # test is timing/finalization-boundary sensitive and flakes, which would redden the PR for
          # reasons unrelated to the ironwood work and obscure that signal. (It still runs weekly.)
          ZECD_REGTEST_EXTENDED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          # The heavy note-scaling stress test runs ONLY on the monthly cron (the 1st-of-month
          # schedule) and on a manual dispatch that ticks `stress` - never on push/PR, and not on
          # the weekly cron. Its note target is `stress-note-count` on dispatch (blank -> default 256).
          ZECD_REGTEST_STRESS: ${{ (github.event.schedule == '33 7 1 * *' || (github.event_name == 'workflow_dispatch' && inputs.stress)) && '1' || '' }}
          ZECD_STRESS_NOTE_COUNT: ${{ inputs.stress-note-count }}
          # The shielded-coinbase e2e needs a zebrad whose block template builds valid shielded
          # coinbase (zebra >= 6.0.0; 5.0.0's Orchard coinbase proof fails its own validation),
          # and self-skips otherwise. The pinned image (6.2.2) and `latest` both have the
          # capability, so a skip is a failure everywhere except a manual dispatch that names a
          # custom (possibly older) image - guards against the test silently never running.
          # (Only the zebra leg ever runs the coinbase suite - it is zebra-only in CI, so on the
          # zakura leg both coinbase tests skip via their ZEBRAD_BIN guard before this is read.)
          ZECD_REGTEST_REQUIRE_SHIELDED_COINBASE: ${{ (github.event_name != 'workflow_dispatch' || inputs.zebra-image == '') && '1' || '' }}
          # The node binary (ZEBRAD_BIN/ZAKURAD_BIN) and LIGHTWALLETD_BIN (zebra leg only) are
          # exported by the provisioning step above.
          #
          # How many test binaries run at once. Each one is a whole zebrad(+lightwalletd)+zecd
          # stack that spends most of its wall clock waiting on that stack rather than burning
          # CPU, so the tier overlaps well - but only as far as the runner has cores and RAM for
          # it. Raise REGTEST_JOBS in lockstep with REGTEST_RUNNER, never past it: an oversubscribed
          # runner does not just run slower, it pushes the harness's sync/confirmation waits past
          # their timeouts and turns into flakes. The per-binary wall-clock table the driver prints
          # at the end of the step is the tuning input.
          #
          # 6 on 8 vCPU was measured, not guessed: 6 -> 5m42s, 8 -> 6m04s, 12 -> 6m07s. Past 6 it
          # gets *slower*, because the tier is no longer bounded by total work but by its longest
          # single binary (regtest_coinbase), and extra concurrency only adds contention around it.
          # Going further means splitting that binary, not raising this number - and note that
          # REGTEST_TEST_THREADS=2, which does exactly that, was tried and reverted: it reached
          # 4m18s but failed both attempts, the second time in regtest_sapling
          # ("getunconfirmedbalance is 0: 3.0"), a one-test binary that was simply starved by the
          # extra load. A minute is not worth a flaky tier.
          REGTEST_JOBS: ${{ vars.REGTEST_JOBS || 6 }}
          REGTEST_LOG_DIR: ${{ runner.temp }}/regtest-logs
        # run-tests.sh builds the binaries once (--locked, against the committed lock) and then
        # runs them REGTEST_JOBS at a time, each in its own slice of the loopback port range. It
        # always runs every binary - the old `--no-fail-fast`, so one flaky test can't mask the
        # rest - and exits non-zero if any failed.
        run: regtest-harness/run-tests.sh ${{ env.HARNESS_TESTS }}

      # run-tests.sh already replays each failing binary's output and tails its node log, so this
      # only adds what it can't know about: the machine's state, and whether a binary died so
      # early it left nothing behind.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="
          df -h / "$RUNNER_TEMP" || true
          echo "== memory =="
          free -g || true
          echo "== captured logs (${{ matrix.node }}) =="
          ls -la "$RUNNER_TEMP/regtest-logs" 2>/dev/null || echo "(no logs were written)"

  # Ironwood (NU6.3) tier. Builds zecd with the `ironwood` feature (no cfg - the librustzcash pin,
  # zcash/librustzcash `dw/ironwood-scan-model`, exposes the ironwood wallet APIs unconditionally),
  # and runs the gated regtest_ironwood receive e2e against the NU6.3 toolchain: the OFFICIAL zebra
  # ironwood release (`zfnd/zebra:6.2.2`) plus a still-dev V6-aware lightwalletd and a regtest-aware
  # zcash-devtool funder. It funds zecd post-NU6.3 (auto-routed to an ironwood output) and asserts
  # zecd labels the received note `pool == "ironwood"`.
  #
  # zebra is now an official image, but lwd + devtool are still DEV images (emersonian/*) that may
  # move or vanish, so this job runs ONLY on the weekly schedule and on manual dispatch - never on
  # other branches' PRs, so a missing image can't redden PR CI. Bump the image refs in `env` below
  # (or pass them as dispatch inputs) as the ironwood stack is rebuilt; keep the NU6.3 height (8) in
  # lockstep with the harness' NU6_3_ACTIVATION_HEIGHT, zecd's network::regtest(), and devtool's
  # regtest_params().
  regtest-ironwood:
    # schedule + manual dispatch, plus the mainline so trunk-bound work auto-runs the NU6.3 e2e
    # without a manual dispatch. `base_ref` matches any PR **into** `main`; `ref` matches a direct
    # push to `main`. (Both clauses named `ironwood` while that was the integration line; the
    # ironwood work sits on the trunk now, so retargeting preserves the original intent.) Still
    # never on unrelated branches' PRs - a PR into a feature branch does not pull in the
    # emersonian/* lwd/devtool images, which remain dev artifacts. Once those images ship, the
    # keying can be dropped entirely so the tier runs everywhere.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
    # Same runner as the tier above. This job runs a single test binary, so it gets nothing from
    # REGTEST_JOBS - but its release build and its Orchard proving are both parallel, and with the
    # zebra leg down to ~8 min this job (12m13s on a 2-core runner) is what the workflow now waits
    # on. Left on the stock runner it would simply become the new ceiling.
    runs-on: ${{ vars.REGTEST_RUNNER || 'ubuntu-latest-8-cores' }}
    name: regtest (ironwood / NU6.3)
    env:
      # zebrad is now the OFFICIAL ironwood-capable release on Docker Hub (`zfnd/zebra:6.2.2`),
      # which is NU6.3-capable and accepts the `"NU6.3"` regtest activation-height key - so the dev
      # `emersonian/zcash-zakura` image is retired. lwd + devtool stay pinned to dev images by
      # @sha256 digest (their tags are mutable), both rebuilt against the official zebra's V6 wire
      # format: lwd = `emersonian/zcash-lwd-ironwood:360a37d-zr8-nu63` (V6 parser for zebra 6.x);
      # devtool = `emersonian/zcash-devtool:cac96846` (== ironwood-valar tip), built with
      # `regtest_support` so its regtest `init` takes `--activation-heights`; sends+receives ironwood.
      # A dispatch input can override any of them (e.g. with a `repo:tag`) when the stack is rebuilt;
      # bump these as the images are rebuilt.
      ZEBRAD_IRONWOOD_IMAGE: ${{ inputs.zebra-ironwood-image || 'zfnd/zebra:6.2.2' }}
      LWD_IRONWOOD_IMAGE: ${{ inputs.lwd-ironwood-image || 'emersonian/zcash-lwd-ironwood@sha256:5f63b64ed788330ad8fe859fbbb334ceea844cf8a376318e7e25fbd3351b2f9f' }}
      DEVTOOL_IRONWOOD_IMAGE: ${{ inputs.devtool-ironwood-image || 'emersonian/zcash-devtool@sha256:fd95d8b432f47d3eec6e5f1eca0bdfbb8daa094c28742d230bec3ac47957bd6c' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            regtest-harness
          # Separate cache key: this build carries the ironwood feature + nu6.3 cfg.
          key: ironwood

      # zecd compiles the ironwood scan/balance/pool/send paths unconditionally now (no cargo
      # feature) - this is a plain release build. NU6.3 activation on the regtest chain is turned on
      # for the zecd process below via the `ZECD_REGTEST_NU63_HEIGHT` env var (see the e2e step).
      - name: Build zecd (release)
        run: cargo build --release --bin zecd

      # Extract zebrad + lightwalletd + the devtool funder from the ironwood toolchain images.
      - name: Provision ironwood zebrad + lightwalletd + devtool from images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            img="$1"; name="$2"; out="$RUNNER_TEMP/bin/$name"
            docker pull -q "$img"
            cid=$(docker create "$img")
            rel=$(docker export "$cid" | tar -tf - | grep -m1 -E "(^|/)${name}\$" || true)
            if [ -z "$rel" ]; then echo "::error::could not locate $name in $img"; docker rm "$cid" >/dev/null; exit 1; fi
            docker cp "$cid:/$rel" "$out"
            docker rm "$cid" >/dev/null
            chmod +x "$out"
            echo "$name -> $out"; file -b "$out" || true
          }
          extract "$ZEBRAD_IRONWOOD_IMAGE" zebrad
          extract "$LWD_IRONWOOD_IMAGE" lightwalletd
          extract "$DEVTOOL_IRONWOOD_IMAGE" zcash-devtool
          echo "ZEBRAD_BIN=$RUNNER_TEMP/bin/zebrad" >> "$GITHUB_ENV"
          echo "LIGHTWALLETD_BIN=$RUNNER_TEMP/bin/lightwalletd" >> "$GITHUB_ENV"
          echo "DEVTOOL_BIN=$RUNNER_TEMP/bin/zcash-devtool" >> "$GITHUB_ENV"

      - name: Run ironwood (NU6.3) receive e2e
        env:
          ZECD_BIN: ${{ github.workspace }}/target/release/zecd
          ZECD_REGTEST_IRONWOOD: "1"
          # Activate NU6.3 at height 8 on the regtest chain for the zecd process (matches the zebra
          # the ironwood harness configures). Ironwood is always compiled; this env var is what turns
          # its activation on for regtest. The standard regtest tier leaves it unset (no NU6.3).
          ZECD_REGTEST_NU63_HEIGHT: "8"
          ZEBRAD_STDERR: ${{ runner.temp }}/zebrad.log
          # Stream zecd's own logs into the run output (info level) so a failure is diagnosable
          # without the debug flood that the receive/send bring-up needed.
          ZECD_STDERR: "1"
          RUST_LOG: "zecd=info"
          # ZEBRAD_BIN / LIGHTWALLETD_BIN / DEVTOOL_BIN are exported by the provisioning step.
        run: cargo test --locked --manifest-path regtest-harness/Cargo.toml --test regtest_ironwood --no-fail-fast -- --nocapture --test-threads=1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "== disk =="
          df -h / "$RUNNER_TEMP" || true
          echo "== zebrad log (last 200 lines) =="
          tail -n 200 "$RUNNER_TEMP/zebrad.log" 2>/dev/null || echo "(no zebrad log was written)"
