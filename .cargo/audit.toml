# cargo-audit configuration (for local `cargo audit` runs; CI uses `cargo deny`,
# whose deny.toml documents the same advisory exceptions).

[advisories]
ignore = [
    "RUSTSEC-2026-0374", # basic-toml unmaintained: build-time only, via age's i18n proc-macros
    "RUSTSEC-2026-0387", # crypto-bigint 0.5.5: age's P-256 tag recipients, which zecd never uses
]
