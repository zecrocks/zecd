[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# One exception. The previous one, RUSTSEC-2026-0173 (proc-macro-error2
# unmaintained), went away when `age` 0.12 moved to i18n-embed-fl 0.10 - which
# depends on the maintained proc-macro-error3 fork - and getset 0.1.7 (orchard's
# build-time dependency) dropped it too.
ignore = [
    # basic-toml unmaintained. Reached only through i18n-config 0.4.8 (its newest
    # release), which `age`'s `fl!` proc-macros use to read age's own i18n.toml at
    # compile time; nothing parses runtime input with it. Drop this once
    # i18n-config or age moves off it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via age's i18n proc-macros; no maintained release of i18n-config avoids it" },
]

[licenses]
version = 2
# zecd is MIT OR Apache-2.0; permit the usual permissive set for
# transitive deps. Tighten as needed if `cargo deny` complains.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # webpki-roots: Mozilla CA root certificate bundle.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# No git sources: the whole librustzcash/ironwood set (including shardtree +
# incrementalmerkletree) now resolves from crates.io, so there is no `allow-git`
# exception to carry. Re-add one only if a dependency ever needs a git pin again.
