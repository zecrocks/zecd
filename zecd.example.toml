# Example zecd configuration. Copy to <datadir>/zecd.toml (or pass --conf) and edit.
# CLI flags (e.g. --rpcuser, --rpcport, --testnet, --datadir, --server) override these.
#
# Validate an edited config against the binary you are about to run, without starting it:
#   zecd config check --conf <file>
# It exits non-zero if that build would refuse the file (zecd rejects unknown keys, so a
# config can be valid for one version and not another), and prints the settings it resolves
# to - including every value left to a built-in default.
#
# For 12-factor / Kubernetes deployments, several secret inputs can come from the environment
# or a mounted Secret file instead of this (ConfigMap-bound) TOML:
#   ZECD_AGE_IDENTITY - path to the age identity (also --age-identity / [keys] age_identity)
#   ZECD_KEYS_FILE - path to the default wallet's keys.toml (also --keys-file / keys_file)
#   ZECD_RPC_PASSWORD - the RPC password (also --rpcpassword / [rpc] password_file)
#   ZECD_DATADIR - the data directory (also --datadir / datadir)
# And for non-interactive `zecd init --restore`:
#   ZECD_MNEMONIC - the seed phrase (also --mnemonic-file); else read from stdin
#   ZECD_WALLET_PASSPHRASE - the at-rest passphrase for `init --encrypt`; else prompted

# Network: "main" or "test".
network = "test"

# Parent directory for per-wallet subdirectories, the cookie file, and (by default) the
# age identity. Each wallet lives in its own subdirectory.
datadir = "./data"

# Wallet selected when a request hits "/" rather than "/wallet/<name>".
default_wallet = "default"

# One section per wallet. The directory holds keys.toml plus one subdirectory per coin, so a
# Zcash wallet's databases live at <dir>/zec/lrz/ (zec = the coin, lrz = librustzcash, the
# library that owns them). zecd is stateless: it keeps no off-chain data the seed can't
# rebuild, so there is no label store on disk.
[wallets.default]
dir = "./data/default"
# Optional: put this wallet's keys.toml somewhere other than <dir>/keys.toml - e.g. a
# Kubernetes Secret mounted read-only, separate from the (disposable, cache-only) data dir.
# The global [keys] keys_file below sets this for the default wallet; ZECD_KEYS_FILE /
# --keys-file override it. The databases still live under <dir>/zec/lrz/.
# keys_file = "/secrets/keys.toml"
# This wallet's own upstream, overriding [backend] below. Every [backend] endpoint key
# (server, tls, tls_roots, tls_insecure_skip_verify, tls_ca_file, tls_pinned_sha256,
# assume_transparent_in_compact_blocks) can be set per wallet and falls back to the global
# value when omitted - so one daemon can serve, say, a zebra-backed spending wallet next to a
# lightwalletd-backed watch-only replica. Deployment-wide settings (timeouts, reconnect
# backoff, the cleartext-locality rules) and the [zebra] credentials stay global.
# server = "zebra://127.0.0.1:8234"

[backend]
# The chain upstream: a LOCAL zebrad's JSON-RPC ("full mode", the default and the
# recommendation), or a lightwalletd gRPC server ("light mode" - no fully synced local
# zebra needed).
#
#   server = "zebra"               # local zebrad: "zebra://127.0.0.1:8234" mainnet /
#                                  # ":18234" testnet (zebrad ships with RPC disabled, so set
#                                  # its `rpc.listen_addr` to that port; the zcashd-convention
#                                  # ports 8232/18232 belong to zecd's own RPC). See [zebra]
#                                  # below for credentials.
#   server = "zebra://host:port"   # a zebrad on another host/port.
#   server = "zecrocks"            # the zec.rocks public lightwalletd (zec.rocks:443 mainnet,
#                                  # testnet.zec.rocks:443 testnet), TLS.
#   server = "https://host[:port]" # any lightwalletd, TLS (port defaults to 443).
#   server = "http://host:port"    # a lightwalletd without TLS - allowed toward
#                                  # loopback/private hosts; refused toward public ones unless
#                                  # allow_remote_cleartext below.
#   server = "host:port"           # a lightwalletd; TLS decided by locality (loopback/private
#                                  # plaintext, public TLS), overridable with `tls` below.
#
# Light-mode notes: a lightwalletd upstream must be 0.5.0 or later for a transparent-enabled
# wallet (that is the first release serving transparent and Ironwood data inside compact blocks;
# zecd probes this at connect and refuses an older server rather than silently missing
# transparent receives). Shielded-only wallets work against any server. Prefer running your own
# zebra when the wallet tracks many funded transparent addresses - spend detection costs one
# upstream query per funded address.
server = "zebra"
# Per-attempt dial timeout (seconds) so a hung/black-holed endpoint can't stall sync.
connect_timeout_secs = 10
# Reconnect backoff (seconds): start at base, double up to max, with full jitter.
reconnect_base_secs = 1
reconnect_max_secs = 60
# lightwalletd TLS mode: "auto" (default - locality heuristic), "yes", or "no". An explicit
# https:// or http:// scheme on `server` wins over this. zebra:// endpoints ignore it
# (always plaintext HTTP, local-only by policy).
# tls = "auto"
# Which roots lightwalletd TLS trusts: "native" (OS store, honors SSL_CERT_FILE - default)
# or "webpki" (embedded Mozilla bundle, for minimal containers).
# tls_roots = "native"
# Trust a private CA for lightwalletd TLS, in addition to the public roots above. The
# certificate is then validated normally - chain, hostname and expiry all checked - so this is
# the best option for a lightwalletd behind your own CA. An unreadable or malformed file fails
# startup rather than quietly falling back to the public roots.
# tls_ca_file = "/etc/zecd/lwd-ca.pem"
#
# Pin lightwalletd's TLS certificate to one or more SHA-256 fingerprints. Get one with:
#   openssl s_client -connect host:443 </dev/null 2>/dev/null \
#     | openssl x509 -noout -fingerprint -sha256
# Colons are optional and case does not matter. It is a list so a replacement certificate can be
# pinned alongside the outgoing one before you switch, avoiding an outage at renewal.
# On its own the pin IS the identity: no chain, hostname, or expiry check runs, which is what
# makes a bare self-signed certificate usable without weakening anything. Combined with
# tls_ca_file, the chain is validated against that CA as well (and only that CA). If a pin ever
# fails, the error names the fingerprint actually presented - verify it out of band before
# trusting it, since a mismatch is either a rotation you did not expect or an impersonation.
# tls_pinned_sha256 = ["AB:CD:EF:...:89"]
#
# UNSAFE: accept any lightwalletd TLS certificate - no chain-of-trust or hostname check. The
# connection stays encrypted but is no longer authenticated, so anyone able to intercept it can
# impersonate the server and see every address and txid this wallet asks about. Prefer
# tls_pinned_sha256 above: it handles the same self-signed case while still authenticating the
# server. Off by default, and refused in combination with tls_ca_file/tls_pinned_sha256.
# tls_insecure_skip_verify = false
#
# Assert that the upstream lightwalletd serves transparent (and ironwood) data inside compact
# blocks. zecd normally decides this from GetLightdInfo.lightwalletProtocolVersion, and refuses
# to run a transparent-enabled wallet against a server that does not serve the data - otherwise
# transparent receives would simply never appear. But no released lightwalletd populates that
# field yet, so even a 0.5.x server that does serve the data reports "incapable" and is refused.
# Set this to true to assert the capability yourself. Off by default: asserting it wrongly
# reintroduces exactly the silent-loss failure the check exists to prevent. Shielded-only
# wallets (the default) never need it, and a "zebra://" upstream ignores it.
# assume_transparent_in_compact_blocks = false

# Credentials for the "zebra" / "zebra://host:port" endpoints above. Omit the whole section
# when zebrad runs with `enable_cookie_auth = false`. A cookie file wins over user/password
# and is re-read on every reconnect (zebrad regenerates it at startup).
# [zebra]
# rpc_cookie = "/var/lib/zebrad/.cookie"
# rpc_user = "user"
# rpc_password = "pass"

[rpc]
bind = "127.0.0.1"
# Mainnet default 8232, testnet default 18232.
port = 18232
# If user/password are omitted, a bitcoind-style cookie file is generated at <datadir>/.cookie.
user = "zec"
password = "change-me"
# The RPC password is spend-equivalent for clients, so in a ConfigMap+Secret split keep it
# OUT of this (ConfigMap-bound) file. Source it from a mounted Secret file or the environment
# instead; precedence is --rpcpassword / ZECD_RPC_PASSWORD > password_file > inline `password`.
# password_file = "/secrets/rpc.password"
# Additional bitcoind-style rpcauth credentials (salted - no plaintext in the config).
# Generate entries with the built-in tool: `zecd rpcauth <user> [password]`
# (omit the password to have a strong random one generated and printed once).
# auth = ["alice:<salt>$<hmac-sha256 hex>"]
#
# Cookie auth: with no user/password pair set, zecd mints a random secret at startup and
# writes __cookie__:<random> to this file (mode 0600). Any local process that can read the
# file authenticates with it - no shared secret to configure, regenerated each startup
# (how bitcoin-cli auths to a local node by default).
# cookiefile = "./data/.cookie"
#
# RPC method safelist. By default (this key absent or empty) every method below is served.
# Uncomment `allowed_methods` and keep ONLY the methods you want reachable: any method not on
# a non-empty list is rejected with -32601 ("Method not found"), exactly as if it did not
# exist - so a locked-down server discloses nothing about what it has disabled. Names are
# validated at startup, so a typo fails fast instead of silently disabling a method.
#
# This is a coarse, server-wide gate, NOT per-user - remember RPC credentials are already spend
# authority (see the README's SECURITY notes). Its value is shrinking the surface: a pure
# invoicing integration only needs an address + a few read methods, so disabling the rest means
# a leaked credential (or a buggy client) can't reach sendtoaddress, encryptwallet, stop, etc.
#
# Every implemented method is listed below; methods left commented stay disabled. Lines marked
# ⚠ are administrative or move funds - think twice before exposing them.
# allowed_methods = [
#   # --- Typical invoicing / payment-monitoring surface (receive + read) ---
#   "getnewaddress",           # hand out a fresh receive address
#   "getbalance",
#   "getbalances",
#   "getunconfirmedbalance",
#   "getwalletinfo",
#   "listtransactions",
#   "listsinceblock",
#   "gettransaction",
#   "listunspent",
#   "getreceivedbyaddress",
#   "listreceivedbyaddress",
#   "getaddressinfo",
#   "listwallets",
#   "validateaddress",
#
#   # --- Spending (omit entirely on a receive-only deployment) ---
#   "sendtoaddress",           # ⚠ moves funds
#   "sendmany",                # ⚠ moves funds
#   "sendrawtransaction",      # ⚠ broadcasts caller-built transactions
#
#   # --- Chain / network / fee (read-only) ---
#   "getrawtransaction",
#   "getblockchaininfo",
#   "getblockcount",
#   "getbestblockhash",
#   "getblockhash",
#   "getblockheader",
#   "waitfornewblock",         # blocks until the wallet scans a new block
#   "waitforblock",
#   "waitforblockheight",      # blocks until the wallet has scanned to a height
#   "getnetworkinfo",
#   "getconnectioncount",
#   "getpeerinfo",
#   "ping",
#   "getmempoolinfo",
#   "estimatesmartfee",
#   "estimatefee",
#   "settxfee",                # inert stub (always returns -8)
#
#   # --- Control ---
#   "uptime",
#   "help",
#   "getrpcinfo",
#   "stop",                    # ⚠ shuts the daemon down (SIGTERM / Ctrl-C also work)
#
#   # --- At-rest encryption / lock state (administrative) ---
#   "walletpassphrase",        # unlock an encrypted wallet for the session
#   "walletlock",              # re-lock
#   "walletpassphrasechange",  # ⚠ rotate the passphrase
#   "encryptwallet",           # ⚠ re-wraps the seed at rest; can lock the owner out
# ]
#
# Accept a repeated *shielded* recipient address within one `z_sendmany` call. Off by default,
# matching zcashd, which refuses any duplicate recipient. Turn it on only if you run a protocol
# that deliberately pays one shielded address from several outputs in a single transaction -
# batching memo-carrying payments, for instance, where the point is one ZIP-317 fee for the
# batch. Neither consensus nor the wallet forbids that shape; the refusal is dialect parity.
# Repeated *transparent* recipients stay refused either way.
# allow_duplicate_shielded_recipients = false

[keys]
# age identity file used to decrypt the wallet seed for unattended sending.
age_identity = "./data/identity.txt"
# Decrypt the seed at startup so sendtoaddress/sendmany work without walletpassphrase.
auto_unlock = true
# Optional: location of the DEFAULT wallet's keys.toml (the age-encrypted seed), independent
# of the datadir, so it can be mounted as a Secret while the datadir stays a disposable cache.
# Equivalent to [wallets.default] keys_file; ZECD_KEYS_FILE / --keys-file override it.
# keys_file = "/secrets/keys.toml"
# Rebuild data.sqlite from keys.toml when the data directory is empty (default true): the
# account is recreated from the seed - immediately for an identity/auto_unlock wallet, at the
# first walletpassphrase for an encrypted one - then the wallet rescans from its birthday. This
# is what lets the data directory be a disposable cache (mount keys.toml as a Secret, start with
# an empty PVC). Set false to instead fail fast on an empty datadir. (Watch-only wallets have no
# seed and aren't covered - recreate them with `zecd init --ufvk`.)
bootstrap_from_keys = true

[pools]
# Shielded value pools this wallet uses. zecd is shielded-only; supported pools are "sapling"
# and "orchard". These are the GLOBAL defaults; any [wallets.<name>] section can override
# `pools`/`default_receivers` independently.
#
# "ironwood" is not a value HERE - not because it isn't a pool, but because this key selects
# *receivers*. Ironwood (NU6.3) very much is a value pool: its own bundle in V6 transactions,
# its own valueBalance, and `pool == "ironwood"` in balances and history. What it lacks is a
# *receiver*: ironwood notes are Orchard V3 notes reusing Orchard's keys, addresses and
# receiver, so there is nothing to request or enable. It is compiled in unconditionally and switches on
# by consensus height, already active on mainnet and testnet, which means an "orchard" wallet
# is receiving ironwood notes today. Legacy Orchard V2 notes stay spendable, and moving them
# into ironwood is a real pool crossing that publishes the amount (see [spend] privacy_policy
# below). enabled = ["ironwood"] is a startup error.
#
# `enabled` - pools the wallet receives into and spends from. Change is sent to the
#                       strongest enabled pool (Orchard if enabled).
# `default_receivers` - receivers included in the Unified Addresses getnewaddress hands out
#                       when no per-call override is given. Must be a SUBSET of `enabled`
#                       (naming a disabled pool is a startup error). Defaults to `enabled`.
#
# The default (this section omitted) is the Orchard receiver only, preserving zecd's historical
# behaviour; post-NU6.3 such a wallet holds ironwood notes at that receiver.
# To enable Sapling receiving as well:
#   enabled = ["sapling", "orchard"]
#   default_receivers = ["sapling", "orchard"]
# getnewaddress accepts a per-call override in its address_type argument, e.g.
#   getnewaddress "" "sapling"          (Sapling receiver only)
#   getnewaddress "" "sapling,orchard"  (both)
# constrained to the enabled pools (else -8).
enabled = ["orchard"]
default_receivers = ["orchard"]
#
# Transparent (t-address) receiving. OFF by default - zecd stays shielded-only. When enabled,
# `getnewaddress "" "transparent"` hands out a bare transparent address (t1.../tm...), funds
# received there are discovered by the block scan (and at 0-conf via the mempool), and they are
# spent explicitly through z_sendmany's fromaddress: a t-address (or ANY_TADDR) as the source
# shields them into the change pool when paying a shielded recipient (requires [spend]
# privacy_policy = "AllowRevealedSenders" or the per-call privacyPolicy), or spends them t->t
# with kept-transparent change under "AllowFullyTransparent" (see [spend] below).
#   transparent = true            # allow getnewaddress "" "transparent"
#   transparent_default = true    # make a bare t-address the no-argument getnewaddress default
#                                 #   (implies transparent = true)
# transparent = false
# transparent_default = false
#
# transparent_gap_limit (default 20; values above 1000 are warned about, above 10000 loudly) is
# the BIP-44-style gap: how far past the issuance frontier (the last address handed out or
# funded, or the transparent_initial_scan floor - whichever is higher) receive discovery keeps
# looking. Unlike shielded funds (always recoverable by note trial-decryption), transparent funds
# are only rediscovered on a from-seed restore within
# transparent_initial_scan + transparent_gap_limit of index 0, plus transparent_gap_limit past
# every funded address found from there (the standard BIP-44 recovery chain). If you pre-generate
# addresses ahead of funding (e.g. one per invoice, most never paid), size it to your maximum
# run of consecutive unfunded addresses. KEEP IT SMALL: every transparent receive the scan
# records re-derives the entire window (one address derivation per index, repeated per output of
# a multi-output transaction), so a wide window costs seconds-to-minutes of CPU per received UTXO
# and can stall a restore. For deep coverage use transparent_initial_scan below instead.
#
# NOTE the two anchors, because they are not the same and the difference is what decides whether
# funds survive a restore. RESTORE recovery is funded-anchored, BIP-44 style: from a bare seed
# zecd rediscovers indices 0..transparent_initial_scan + transparent_gap_limit, then extends
# transparent_gap_limit past each FUNDED index it finds - merely handing an address out does not
# extend it, because issuance leaves no trace on chain. The RUNNING wallet's lookahead is
# exposure-anchored: it also slides past addresses you have merely handed out, so a live wallet
# can credit a receive that a restore of the same seed would not rediscover. That band opens only
# when getnewaddress issues at/past the recovery horizon, which is what
# transparent_allow_beyond_recovery_window below governs. Watch it directly:
# getwalletinfo.transparent reports lookahead_from/lookahead_through (the live window, inclusive),
# recovery_horizon, and restorable - a single boolean that is false exactly when the wallet is
# crediting addresses a from-seed restore would miss.
# transparent_gap_limit = 20
#
# transparent_initial_scan (default 0 = off) is the better tool when you hand out MANY addresses
# ahead of funding. The gap limit is a SLIDING window, so sizing it to 10000 means scanning 10000
# addresses past every funded index forever. Instead, transparent_initial_scan pre-exposes
# external indices 0..N ONCE at startup/restore so the receive scan covers all of them, while
# transparent_gap_limit stays small for steady-state. Set N to your issuance high-water mark
# (e.g. an exchange that assigns 10000 customer addresses sets transparent_initial_scan = 10000);
# the two compose, so getnewaddress keeps issuing recoverable addresses for another
# transparent_gap_limit indices past the floor before it warns.
# transparent_initial_scan = 0
#
# transparent_allow_beyond_recovery_window (default true) controls what getnewaddress "" "transparent"
# does once the recovery horizon (transparent_initial_scan + transparent_gap_limit) is full of
# handed-out addresses with no funding to slide the window forward. A from-seed restore could not
# rediscover funds sent past that point. The default (true) issues the address anyway and logs a
# loud warning that funds received there may be UNRECOVERABLE from seed. Set it to false to instead
# FAIL the call with an actionable error - fail-closed, so funds can never land on an unrecoverable
# address. Either way, raise transparent_initial_scan to your issuance high-water mark (or get a
# recent address funded) to move the horizon forward - prefer that over widening
# transparent_gap_limit (see its cost note).
# transparent_allow_beyond_recovery_window = true
#
# transparent_gap_warn_threshold (default 5) - getnewaddress logs a warning once fewer than this many
# in-window address slots remain, giving you lead time to widen the limits before addresses start
# landing outside the recovery window.
# transparent_gap_warn_threshold = 5

[sync]
# How often to poll zebra for new blocks (seconds).
interval_secs = 20
# How often (at most) to re-broadcast wallet txs that are unmined and unexpired (seconds).
# Covers sends whose initial broadcast failed and mempool drops across upstream restarts.
rebroadcast_secs = 60

[spend]
# The wallet-wide confirmations policy (ZIP 315 defaults, like Zallet): how deep an output
# must be before it is spendable. Anchors getbalance/getbalances/getwalletinfo and spend
# proposals; getbalance's explicit minconf argument overrides it per call. Lowering these
# trades reorg/double-spend safety for latency.
# Confirmations before the wallet's *own* outputs (change) are spendable.
trusted_confirmations = 3
# Confirmations before third-party payments are spendable (must be >= trusted_confirmations).
untrusted_confirmations = 10
# What sends may reveal on-chain (zcashd/Zallet's privacy-policy opt-in, zcash/zcash#6240). A
# five-rung ladder from most to least private; unlike zcashd's policy lattice it is linear, so
# each rung also permits everything the rungs above it forbid:
#   "FullPrivacy" - only fully-shielded sends confined to a single shielded pool: no transparent
#       recipients, and no Sapling<->Orchard crossing. Anything that would reveal an amount or a
#       recipient is rejected with -8.
#   "AllowRevealedAmounts" - allow Sapling<->Orchard cross-pool sends (which reveal the transferred
#       amount on-chain via valueBalance) but still reject transparent recipients (which would
#       additionally reveal the recipient) with -8.
#   "AllowRevealedRecipients" (default) - additionally allow transparent recipients; such a send
#       reveals both the amount and the recipient (and is paid from shielded notes).
#   "AllowRevealedSenders" - additionally allow funding a send from the wallet's transparent
#       UTXOs (z_sendmany with a t-address or ANY_TADDR fromaddress), which reveals the sender's
#       addresses and input amounts; the change is shielded. With a shielded recipient this is
#       the t->z shielding send. A transparent source without this rung is -4.
#   "AllowFullyTransparent" - additionally allow the fully transparent t->t send: transparent
#       inputs, a transparent recipient, and kept-transparent change (never touching a shielded
#       pool) - the most revealing send possible.
# z_sendmany's per-call privacyPolicy accepts these plus zcashd's AllowLinkingAccountAddresses
# (maps onto AllowRevealedSenders - zecd is single-account, so there is nothing extra to link)
# and NoPrivacy (maps onto AllowFullyTransparent).
privacy_policy = "AllowRevealedRecipients"
# Cap on the number of Orchard actions (max of Orchard inputs vs. Orchard outputs) a single
# send may build, mirroring Zallet's [builder.limits] orchard_actions. It bounds the memory and
# proving cost of one z_sendmany and gives a clear -8 ("too many Orchard actions") instead of a
# deep builder error when a send has too many recipients. Raise it for large batched payouts;
# set it to 0 to disable the cap entirely.
orchard_action_limit = 50
# Build the Orchard proving key once at startup and reuse it for every send (via the PCZT
# prove path), instead of librustzcash's fused path which rebuilds it (~seconds of keygen) on
# every transaction. On by default. Set false to fall back to the fused path (e.g. to
# benchmark, or if a PCZT issue is suspected); both paths produce identical transactions.
cache_proving_key = true
# Run a send's proving step OFF the single-writer actor, so a long send (which, on a large,
# note-fragmented wallet, can take minutes) no longer freezes background sync, reads, and the
# health/status endpoints for its whole duration. Sends still serialize (only one proof is
# uncommitted at a time - no double-spend surface); the win is that the actor stays live while
# the proof runs on a blocking thread. Only engages on the cached-Orchard PCZT path above (an
# Orchard-only wallet with cache_proving_key on); a Sapling-spending wallet keeps the inline
# path. OFF by default - enable once validated for your workload.
pipeline_proving = false

[health]
# Unauthenticated liveness/readiness probes on a separate port (for Kubernetes/load balancers).
enabled = true
bind = "127.0.0.1"               # set 0.0.0.0 to expose probes off-host
port = 9233
# What /readyz means:
#   "synced" (default) - ready only once connected AND `fully_scanned` is within `max_scan_lag`
#       blocks of the chain tip (and the enhancement backlog has drained). Strict: a from-birthday
#       restore stays not-ready until it has scanned to its own funds. This is the default so a
#       client routed by readiness never sees an empty or stale balance/history as authoritative
#       while the wallet is still scanning - keep it for any balance-sensitive deployment. (The
#       height gap is used rather than librustzcash's note-weighted scan progress, which reaches
#       100% long before the wallet has actually caught up to the tip.)
#   "connected" - ready as soon as the backend is connected and its chain tip is past this
#       wallet's birthday height (a sanity check that we're on the right, live network). It does
#       NOT wait for the wallet to finish scanning, so RPC clients can reach zecd while it catches
#       up, and readiness doesn't flap during a long sync. Reads may lag the tip until the wallet
#       is caught up - the per-wallet `scan_lag` in /readyz and /status shows by how much. Choose
#       this only when reachability matters more than balance freshness.
readiness = "synced"
# Only consulted in "synced" mode:
max_scan_lag = 4
